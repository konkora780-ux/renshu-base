<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>練習ベース</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1B6B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="練習ベース">
<style>
:root{
  --green:#1B6B3A; --green-d:#134E2A; --green-l:#E7F2EA; --ink:#1C2420; --sub:#5C6A62;
  --line:#D5DDD7; --bg:#F4F7F4; --card:#fff; --warn:#B4541A; --danger:#B3261E;
  --wup:#C77700; --tr1:#1565C0; --tr2:#6A3FB5; --game:#1B6B3A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.04em}
header.top small{opacity:.8;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 96px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 8px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--green);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;min-height:44px;font-size:15px}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.btn.danger{color:var(--danger);border-color:#E7C2BF}
.btn.sm{min-height:36px;padding:5px 10px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--green);font-weight:700;padding-left:4px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:15;background:var(--green);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:92px;resize:vertical}
label.f{display:block;margin-bottom:12px}
label.f>span,.flabel{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
.hint{font-size:12px;color:var(--sub);font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 12px;font-size:14px;min-height:36px}
.chip input:checked+span{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:16px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.count{font-size:13px;color:var(--sub);margin:6px 2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;overflow:hidden;padding:0;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/10;background:var(--green-l);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.thumb svg{width:58%;opacity:.55}
.cbody{padding:10px 12px 12px}
.cbody h3{margin:4px 0 2px;font-size:16px;line-height:1.4}
.meta{font-size:12.5px;color:var(--sub);margin:0}
.badge{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:1px 8px;margin-right:4px;background:var(--sub)}
.cat-wup{background:var(--wup)}.cat-tr1{background:var(--tr1)}.cat-tr2{background:var(--tr2)}.cat-game{background:var(--game)}
.star{color:#D99A00}
.empty{text-align:center;color:var(--sub);padding:36px 12px}
/* カード詳細（JFA資料と同じ並び） */
.sheet{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sheet-head{display:flex;align-items:stretch;border-bottom:3px solid #111}
.sheet-head .tema-l{background:#111;color:#fff;font-weight:700;padding:8px 14px;white-space:nowrap}
.sheet-head .tema{font-weight:800;font-size:19px;padding:6px 14px;flex:1}
.sheet-head .srcline{font-size:12px;color:var(--sub);padding:10px 12px;text-align:right}
.sheet-body{padding:14px}
.sheet h2{margin:0 0 12px;font-size:22px;line-height:1.35}
.sheet h2 .catbig{font-size:26px;font-weight:900;margin-right:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
.figs img{width:100%;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff;display:block}
.nofig{border:1px dashed var(--line);border-radius:8px;padding:28px 10px;text-align:center;color:var(--sub);font-size:14px}
.sheet h4{margin:0 0 4px;font-size:15px}
.sheet dl{margin:0 0 12px}
.sheet dt{font-weight:700;font-size:14px;margin-top:4px}
.sheet dd{margin:0 0 2px 1em}
.pre{white-space:pre-wrap}
.keybox{border:1.5px solid #111;margin:14px 0 12px;padding:14px 12px 8px;position:relative}
.keybox h4{position:absolute;top:-13px;left:-1.5px;background:#111;color:#fff;padding:1px 12px;font-size:14px}
.keybox ul{margin:0;padding-left:1.2em}
.notebox{border:1px dashed #555;margin:16px 0 12px;padding:14px 12px 8px;position:relative}
.notebox h4{position:absolute;top:-13px;left:8px;background:#E3E6E4;padding:1px 12px;font-size:14px}
.notebox.gk h4{background:#BFE0E6}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--sub);margin-top:10px}
.oplist a{display:inline-block;margin:2px 8px 2px 0}
a{color:var(--green)}
/* 計画 */
.planrow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.planrow b{display:block}
.total{font-weight:700;margin:4px 0 12px}
.total.over{color:var(--warn)}
.slot{background:#fff;border:1px solid var(--line);border-left:6px solid var(--sub);border-radius:12px;padding:12px;margin-bottom:10px}
.slot.s-wup{border-left-color:var(--wup)}.slot.s-tr1{border-left-color:var(--tr1)}.slot.s-tr2{border-left-color:var(--tr2)}.slot.s-game{border-left-color:var(--game)}
.slot-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.slot-h .name{font-weight:800;font-size:17px}
.slot-card{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.slot-card img{width:96px;height:64px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff}
.slot-card .t{font-weight:700;font-size:16px;border:0;background:none;padding:0;text-align:left;color:var(--green);text-decoration:underline}
.pickbtn{width:100%;border:2px dashed var(--line);background:var(--bg);border-radius:10px;padding:16px;color:var(--sub);font-weight:700;margin-bottom:8px}
.slot-f{display:grid;grid-template-columns:110px 1fr;gap:8px}
.slot-card{flex-wrap:wrap}
.slot-card>.grow{min-width:180px}
.rate{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.rate input{flex:1;min-width:180px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;padding:0}
/* モーダル */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:#fff;width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
@media(min-width:760px){#modal{align-items:center}#modal .box{border-radius:18px}}
.pickitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;margin-bottom:6px}
.pickitem img,.pickitem .ph{width:84px;height:56px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:var(--green-l);flex:none}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:#222;color:#fff;border-radius:22px;padding:10px 18px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
#a2hs{background:#FFF4D6;border:1px solid #E5C76B;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:none}
.imgstrip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.imgstrip .it{position:relative}
.imgstrip img{height:92px;border:1px solid var(--line);border-radius:8px;display:block;background:#fff}
.imgstrip .x{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:14px;border:0;background:#222;color:#fff;padding:0}
.imgstrip .re{position:absolute;left:4px;bottom:4px;border:0;border-radius:8px;background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:4px 8px}
/* 作図ボード */
#board{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column}
#board.on{display:flex}
.b-top{background:var(--green);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
.b-top b{flex:1;text-align:center}
.b-top .btn{color:var(--ink)}
.b-tools{display:flex;flex-wrap:wrap;gap:6px;padding:8px;align-items:stretch}
@media(max-width:640px){.b-tools{flex-wrap:nowrap;overflow-x:auto}}
.b-tools select{width:auto;min-height:52px;flex:none}
.tool{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;min-width:60px;padding:4px 6px 3px;font-size:11px;line-height:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tool svg{width:30px;height:30px;pointer-events:none}
.tool.on{border-color:var(--green);background:var(--green-l);box-shadow:inset 0 0 0 1.5px var(--green);font-weight:700}
.b-canvas{flex:1;min-height:0;padding:0 8px;position:relative}
#bpick{position:absolute;inset:0;background:var(--bg);overflow:auto;padding:4px 12px 16px;display:none}
#bpick.on{display:block}
#bpick h3{margin:6px 0 10px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:#1f6f3d;color:#fff;font-size:12px;font-weight:700}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.picktile{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:6px;align-items:center}
.picktile svg{width:100%;border:1px solid var(--line);border-radius:6px;pointer-events:none}
#bsvg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.b-sel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:60px;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);font-size:13px;color:var(--sub)}
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:11pt}
  body>*:not(#print){display:none!important}
  #print{display:block}
  .p-head{border-bottom:3px solid #111;margin-bottom:8px;padding-bottom:4px}
  .p-head h1{margin:0;font-size:18pt}
  .p-head p{margin:2px 0 0;font-size:10.5pt}
  table.p-table{width:100%;border-collapse:collapse;font-size:10pt}
  .p-table th,.p-table td{border:1px solid #333;padding:4px 6px;vertical-align:top;text-align:left}
  .p-table th{background:#eee}
  .p-table img{max-width:42mm;max-height:30mm;display:block;margin-top:3px}
  .p-table ul{margin:0;padding-left:1.1em}
  .p-memo{border:1px solid #333;min-height:28mm;margin-top:8px;padding:4px 6px;font-size:10pt}
  .p-page{break-before:page}
  .sheet{border:0;border-radius:0}
  .sheet-body{padding:8px 0}
  .figs img{max-height:95mm;width:auto;max-width:100%}
  .keybox,.notebox,.slot{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top"><h1>練習ベース</h1><small>サッカー</small></header>
<main id="main"></main>
<nav class="tabs">
  <button data-act="tab" data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>図鑑</button>
  <button data-act="tab" data-tab="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 11h8M8 15h8"/></svg>計画</button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>設定</button>
</nav>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<div id="print"></div>
<div id="board">
  <div class="b-top"><button class="btn sm" data-act="bCancel">やめる</button><b>図を描く</b><button class="btn sm" data-act="bUndo">もとに戻す</button><button class="btn sm" data-act="bDone" style="font-weight:700">完了</button></div>
  <div class="b-tools" id="btools"></div>
  <div class="b-canvas"><svg id="bsvg" viewBox="0 0 1000 700"></svg><div id="bpick"></div></div>
  <div class="b-sel" id="bsel"></div>
</div>

<script>
'use strict';
/* ========== 定数 ========== */
const CATS=[{id:'wup',label:'W-up'},{id:'tr1',label:'Tr.1'},{id:'tr2',label:'Tr.2'},{id:'game',label:'Game'}];
const AGES=['U-8','U-10','U-12','U-15','U-18','一般'];
const SRC={own:'自作',jfa:'JFAなどの資料',web:'ネット',book:'書籍'};
const EQUIP=['ボール','マーカー','コーン','ビブス','ゴール','ミニゴール'];
const DEFAULT_THEMES=[
  ['攻撃','ゴールを奪う（シュート）'],['攻撃','ボールを運ぶ（ドリブル）'],['攻撃','パス＆コントロール'],['攻撃','ポゼッション'],['攻撃','ビルドアップ'],['攻撃','クロス'],['攻撃','コンビネーション'],['攻撃','ヘディング'],['攻撃','ロングキック'],
  ['守備','ボールを奪う'],['守備','ゴールを守る'],['守備','1対1の守備'],['守備','チャレンジ＆カバー'],['守備','ゴール前の攻防'],
  ['切り替え','攻→守'],['切り替え','守→攻'],
  ['GK','キャッチング'],['GK','ポジショニング'],['GK','配球'],['GK','シュートストップ'],['GK','ブレイクアウェイ'],['GK','クロス対応'],
  ['からだ','コーディネーション'],['からだ','アジリティ'],['からだ','ボールフィーリング']
].map(([group,name])=>({group,name}));
const PITCH='<svg viewBox="0 0 100 62" fill="none" stroke="#1B6B3A" stroke-width="2"><rect x="2" y="2" width="96" height="58" rx="2"/><path d="M50 2v58"/><circle cx="50" cy="31" r="9"/><rect x="2" y="19" width="12" height="24"/><rect x="86" y="19" width="12" height="24"/></svg>';

/* ========== 小道具 ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const num=v=>{const n=parseInt(v,10);return Number.isFinite(n)&&n>=0?n:null;};
const catLabel=id=>(CATS.find(c=>c.id===id)||{}).label||id;
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const safeImg=u=>/^data:image\//.test(u||'');
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600);}

/* ========== 保存（IndexedDB） ========== */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('renshu-base',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('cards',{keyPath:'id'});d.createObjectStore('plans',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'key'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const store=(name,mode)=>db.transaction(name,mode).objectStore(name);
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const dbAll=name=>req(store(name,'readonly').getAll());
const dbPut=(name,o)=>req(store(name,'readwrite').put(o)).catch(e=>{console.error(e);toast('保存に失敗しました。空き容量を確認してください');});
const dbDel=(name,id)=>req(store(name,'readwrite').delete(id));

/* ========== 状態 ========== */
const S={cards:[],plans:[],themes:[]};
const F={q:'',cat:'',theme:'',age:'',players:'',src:'',sort:'',fav:false};
let stack=[{name:'library'}];
let edit=null;   // カード編集中の一時データ {images,opIds}
let picker=null; // カード選択モーダルの状態
const card=id=>S.cards.find(c=>c.id===id);
const plan=id=>S.plans.find(p=>p.id===id);
const view=()=>stack[stack.length-1];
function go(v){stack.push(v);render();window.scrollTo(0,0);}
function back(){if(stack.length>1)stack.pop();render();}

function normCard(o){
  const arr=v=>Array.isArray(v)?v.map(String).filter(Boolean):(v?String(v).split(/[、,]/).map(x=>x.trim()).filter(Boolean):[]);
  const txt=v=>Array.isArray(v)?v.join('\n'):String(v??'');
  const src=o.src&&typeof o.src==='object'?o.src:{};
  return {id:o.id||uid(),sport:o.sport||'soccer',name:String(o.name||'（名前なし）'),
    cats:arr(o.cats).filter(c=>CATS.some(x=>x.id===c)),themes:arr(o.themes),ages:arr(o.ages),
    minP:num(o.minP),maxP:num(o.maxP),gk:!!o.gk,minutes:num(o.minutes),size:String(o.size||''),equip:arr(o.equip),
    method:txt(o.method),keys:txt(o.keys),steps:txt(o.steps),notes:txt(o.notes),gkPoints:txt(o.gkPoints),
    images:(Array.isArray(o.images)?o.images:[]).map(x=>typeof x==='string'?{src:x,board:null}:{src:String(x&&x.src||''),board:x&&x.board?normBoard(x.board):null})
      .map(x=>x.board?{src:svgURL(x.board),board:x.board}:x).filter(x=>safeImg(x.src)),opIds:arr(o.opIds),
    src:{type:SRC[src.type]?src.type:'own',title:String(src.title||''),url:String(src.url||'')},
    memo:txt(o.memo),fav:!!o.fav,share:!!o.share,created:o.created||Date.now(),updated:o.updated||Date.now()};
}
function normPlan(o){
  return {id:o.id||uid(),date:String(o.date||today()),title:String(o.title||''),theme:String(o.theme||''),age:String(o.age||''),
    players:num(o.players),totalMin:num(o.totalMin),
    slots:(Array.isArray(o.slots)?o.slots:[]).map(s=>({id:s.id||uid(),cat:CATS.some(c=>c.id===s.cat)?s.cat:'tr1',cardId:s.cardId||null,minutes:num(s.minutes),memo:String(s.memo||''),rating:[1,2,3].includes(+s.rating)?+s.rating:0,result:String(s.result||'')})),
    review:String(o.review||''),template:!!o.template,draftTpl:!!o.draftTpl&&!o.template,done:!!o.done,created:o.created||Date.now(),updated:o.updated||Date.now()};
}
const saveCard=c=>{c.updated=Date.now();return dbPut('cards',c);};
const savePlan=p=>{p.updated=Date.now();return dbPut('plans',p);};
const saveThemes=()=>dbPut('meta',{key:'themes',value:S.themes});
async function ensureThemes(list){let added=false;for(const t of list){if(t&&!S.themes.some(x=>x.name===t)){S.themes.push({group:(DEFAULT_THEMES.find(d=>d.name===t)||{}).group||'じぶんのテーマ',name:t});added=true;}}if(added)await saveThemes();}
// 実施ずみの計画から、カードごとの使用回数・最後に使った日・できばえを集める
const RATE={3:'◎',2:'○',1:'△'};
function cardStats(){
  const m=new Map();
  for(const p of S.plans){if(!p.done||p.template)continue;
    for(const s of p.slots){if(!s.cardId)continue;const o=m.get(s.cardId)||{n:0,last:'',sum:0,rn:0,rows:[]};
      o.n++;if(p.date>o.last)o.last=p.date;if(s.rating){o.sum+=s.rating;o.rn++;}o.rows.push({p,s});m.set(s.cardId,o);}}
  return m;
}
const planTitle=p=>p.title||`${p.date} ${p.theme||'トレーニング'}`;
const slotMin=s=>s.minutes??(card(s.cardId)||{}).minutes??null;

    {id:'p3-n2',src:s18('③ ゴールを目指す（ポゼッション）'),name:'パス＆コントロール（中央のコーンで270度ターン）',cats:['wup'],themes:['パス＆コントロール','ポゼッション'],size:'18m×24m',equip:['ボール','コーン','マーカー'],
     method:'① スタートのマーカーから中央のコーンまでドリブルし、270度ターンしてサイドの選手へパス。サイドの選手は逆の動きを入れておいて、遠いほうのマーカーの間で受ける\n② 同じようにドリブルし、いろいろなターンをしてサイドの選手へパス。サイドの選手は逆の動きを入れて近いほうのマーカーの間で受け、リターンして、遠いほうのマーカーの間でもう一度受ける\n③ ②と同じように始め、3人目の選手が遠いほうのマーカーの間へ動き出す',
     keys:'パス＆コントロールの質\nターンの質\n動き出しのタイミング',
     notes:'左右、両方の回りで行う\n反復回数を確保するために、スタートのタイミングを決める（前の選手がターンをしたら、など）\nまずパスの質を求め、その中でタイミングを求めていく'},
    {id:'p3-n3',src:s18('③ ゴールを目指す（ポゼッション）'),name:'5対5＋サイドサーバー＋GK',cats:['tr2'],themes:['ポゼッション','ビルドアップ'],minP:12,maxP:12,gk:true,size:'縦42〜45m、横30m＋両サイドに3mずつ',equip:['ボール','ゴール','ビブス','マーカー'],
     method:'GKからスタート\nサイドのサーバーは、サイドのエリアの中だけでプレーする\nサイドのスペースには、守備側が奪いに行ってよい',
     keys:'動きながらのパス、コントロールの質\n動き出しのタイミング\nスクリーン＆ターン\nサポートの質',
     gkPoints:'ボールとまわりの状況を観ながら、攻守でポジションを取り続けているか\nコーチング（1stDFの決定、オフのポジショニング、リスク管理）'},
    {id:'p3-n4',src:s19('① ゴールを奪う','01'),name:'シュートドリル（ヘディングからボレー・コーンを外／内へ）',cats:['wup'],themes:['ゴールを奪う（シュート）','ヘディング'],size:'ペナルティエリアの手前。コーンの幅はゴールエリアの延長線上',equip:['ボール','ゴール','マーカー','コーン'],
     method:'① 手で投げてもらったボールをヘディングで返し、ボレーシュート\n② ドリブルでコーンを外側へかわしてシュート\n③ ドリブルでコーンを内側へかわしてシュート\nスタート位置は、レベルに応じて調整する'},
    {id:'p3-n5',src:s19('① ゴールを奪う','01'),name:'シュートドリル（内側にターンしてシュート・横から）',cats:['tr1'],themes:['ゴールを奪う（シュート）'],gk:true,size:'ペナルティエリアの手前。距離はレベルに応じて調整',equip:['ボール','ゴール','マーカー','コーン'],
     method:'出し手は、ドリブルでコーンを内側にかわしてからパス\n④ 受け手はタイミングよく動き出して受け、内側にターンしてシュート（ボール状況によって、外側にターンしてシュートも入れる）\n⑤ サイドの選手は1タッチで持ち出して、ペナルティスポットへキック。中の選手は横からのボールをシュート\n④からGKが入る',
     keys:'4隅に強いシュートをねらう\n動きながらのパス、コントロールの質\n動き出しのタイミング\nボールに寄る\n面を作る',
     notes:'横からのボールは、相手（コーン）の背後で受けてワンタッチでシュート。面で合わせ、コンパクトに当てる\n（キーファクターと留意点は、同じ内容の2018年版から）'},
    {id:'p3-n6',src:s19('④ ゴールを目指す','04'),name:'3対3＋ターゲット（ラインゴール）',cats:['tr1'],themes:['ポゼッション','ボールを運ぶ（ドリブル）'],minP:8,maxP:8,size:'20m×18m',equip:['ボール','ビブス','コーン','マーカー'],
     method:'ボールを保持しながら、ラインをドリブルで通過したら得点\nターゲットにパスして、リターンを受けてラインを通過しても得点\n後方のサーバーへのバックパスあり'},
    {id:'p3-n7',src:s19('④ ゴールを目指す','04'),name:'パス＆コントロール（7人1組・縦パスと3人目）',cats:['wup'],themes:['パス＆コントロール','コンビネーション'],minP:7,maxP:7,size:'20m×8m',equip:['ボール','コーン','マーカー'],
     method:'A（手前）→ B（中間のサイド）→ C（奥）の順につなぐ。まずAからBへパス\n① Bは前を向いてCへパス\n② Bは内側へコントロールしてCへパス\n③ Bは、後方へサポートしたAへ落とす。Aからもう一度Bへ、BからCへ\n④ Bは、後方へサポートしたAへ落とす。AからCへ縦パス\nCはパスを受けてワンツーし、ドリブルで持ち出して、Aのいたスタート位置へ\nオプション⑤：コーチがDF役に入って、いろいろな状況を作る。BはCへパスを入れ、リターンを受けてターン → 動き出した選手へスルーパス'},
    // ---- JFA 2018 GKトレーニング ----
    {id:'p3-g1',src:sgk,name:'GK：基本姿勢',cats:['wup'],themes:['ポジショニング','シュートストップ'],gk:true,size:'ゴール前',equip:['ボール','ゴール'],
     method:'ゴール前で、コーチと向かい合って構える\n1 コーチはキックの動作だけをする（12m）\n2 コーチはスローイングの動作だけをする（9m）\n3 コーチがスローイングでサーブする（9m）\n4 コーチがキックでサーブする（12m）',
     keys:'いつでも、どこへでも動ける姿勢を作る\nスタンス：肩幅よりやや広く（ひざを曲げられる幅）\n足の向き：つま先をボール（シューター）に向ける\n重心：ひざを軽く曲げ、前傾を保つ\n手の位置：両ひじを軽く曲げ、上にも下にも動かしやすい位置に\n頭を固定して、ボールをしっかり観る\n構えるタイミング：シュートを打たれる直前',
     notes:'足を外に開きすぎない\n後ろ体重にならない\n予備動作を小さくする\n構えるタイミングを常に意識する'},
    {id:'p3-g2',src:sgk,name:'GK：キャッチング（オーバーハンド・アンダーハンド）',cats:['tr1'],themes:['キャッチング','シュートストップ'],gk:true,size:'ゴール前',equip:['ボール','ゴール'],
     method:'オーバーハンドキャッチ（胸の高さ、ライナー、ジャンピング）\nアンダーハンドキャッチ（腰の高さ、バウンド、グラウンダー）\nコーチは、手投げ → キックの順でサーブする\n発展：GKからボールを転がし、キッカーはワンタッチでGKへ蹴る（キャッチの切りかえ）',
     keys:'構えるタイミングと、その姿勢\nボールのコースに体を運ぶ（体の正面でキャッチ）\nボールに寄る\n体の前でボールをとらえる\n最後まで目を離さない\n1回でつかむ（両手が同時にボールにふれる）\nオーバーハンド：ボールの後ろに手を置く。とらえる位置。吸収する動き\nアンダーハンド：手の置き方。とらえる位置。ひざの曲げ方',
     notes:'指を大きく開く\nボールが抜けないように、後ろからつかむ\nオーバーハンド：手だけで取りに行かない。手の間からボールを観る\nアンダーハンド：両側からはさむのではなく、後ろからつかむ。ボールの後ろに「第二の壁」を作る'},
    {id:'p3-g3',src:sgk,name:'GK：ステッピング（サイドステップ・クロスステップ）',cats:['tr1'],themes:['ポジショニング','シュートストップ'],gk:true,size:'ゴール前',equip:['ボール','ゴール'],
     method:'観る → 移動 → 構える → キャッチングの流れで行う\n1 中央から斜め45°へ移動して、構えてキャッチ\n2 斜め45°から、逆サイドの斜め45°へ移動して、構えてキャッチ\n（1）サイドステップで　（2）クロスステップで',
     keys:'観る（シューターの位置をつかんでおく）\n適切な移動方法を選ぶ\nボール（シューター）から目を離さない\n構えるタイミングと、その姿勢\n安全で確実なプレー\nサイドステップ：できるだけ両足を地面につけて移動する（跳ばない）。足幅は基本姿勢のまま。ボールに正対する\nクロスステップ：上体をボール方向に正対させる。サイドステップへの切りかえ',
     notes:'距離と時間に応じて、ステップを選ぶ\n地面すれすれを移動し、上下動を少なくする\n移動中の手の位置'},
    {id:'p3-g4',src:sgk,name:'GK：ローリングダウン＆ダイビング',cats:['tr1'],themes:['シュートストップ','キャッチング'],gk:true,size:'ゴール前',equip:['ボール','ゴール'],
     method:'ローリングダウン：長座、立てひざ、立った状態の順に、ボールを抱えて行う → コーチの投げるライナーやグラウンダーに対して行う\nダイビング：止まったボールに対して → コーチの投げるグラウンダーやライナーに対して\nGKが返球する時は、起き上がってから投げる（攻守の切りかえ）',
     keys:'体の側面から着地する\n体の下側から、順に着地する\n体の正面・前方でボールを処理する（ボールに正対する）\n踏みこむ足\nプレーの方向\n安全で確実なキャッチング',
     notes:'踏みこむ足は、ボールへ最短距離で。大きく踏みこみすぎない\nローリングダウンからダイビングへ、なめらかにつながっているか\n関節（肩、ひじ、腰、ひざ）から落ちない\nグラウンダーは、両手と地面の3点でつかむ\nひじが体の下に入らないようにする\nダイビング後の足は、高く上げすぎない\nリバウンドを作らない'},
    {id:'p3-g5',src:sgk,name:'GK：アングルプレー（シュートに対するポジショニング）',cats:['tr1'],themes:['ポジショニング','シュートストップ'],gk:true,size:'ペナルティエリア（シュートは3方向から）',equip:['ボール','ゴール','コーン'],
     method:'① 止まったボールからのシュート。GKはゴール中央付近から移動する → 次は、プレーした場所から移動する\n② 発展：ワンコントロール（外側、内側）からのシュート（ポジションの微調整）\n② 発展：パスからシュート\nキャッチしたら、すぐスローイング（ターゲットは小ゴールや人でよい）\nコーチはゴール裏から、ポジションを確認する',

     notes:'ゴールの中央とボールを結んだ線上に立ち、頭上をこされない距離だけ前に出て、角度をせばめる\nボールに正対する\n角度のない位置では、ニアサイドを空けない\n目安（ニアポスト、PKマーク、ゴールエリアの角）を使って、位置を確かめる\nリバウンドを作らない'},
    {id:'p3-g6',src:sgk,name:'GK：フロントダイビング',cats:['tr1'],themes:['ブレイクアウェイ'],gk:true,size:'ゴール前',equip:['ボール','ゴール','コーン'],
     method:'止まったボールに対して、ワンステップで\n止まったボールとの距離を離して、助走してから\n発展①：コーチがワンタッチしたボールに対して（コーチが動かした方向へ）\n発展②：コーチがフェイントでコーンをかわしたボールに対して',
     keys:'開始姿勢\nアプローチのコース\n間合い\n踏み切り\n面を作る\nボールをとらえる位置',

    {id:'p3-g7',src:sgk,name:'GK：ジャンピングキャッチ',cats:['tr1'],themes:['クロス対応','キャッチング'],gk:true,size:'ゴール前',equip:['ボール','ゴール'],
     method:'正面から、正面へ手投げでサーブされたボールをジャンピングキャッチ\n正面から、ややサイドへ手投げでサーブされたボールを\n① 得意な足で踏み切る　② 苦手な足でも踏み切る　③ ボールに合わせて踏み切る\nサーバーをサイドに固定し、ニア → 中央 → ファーの順でサーブ\n発展：サーブされたボールの軌道を自分で判断して、ジャンピングキャッチ\nFW役として、もう1人のGKが中央に立つ',
     keys:'観ておく\n開始姿勢\n決断の声「キーパー！」\n落下地点の見きわめ\n適切な移動（ステッピング、アプローチのコース）\nジャンプのタイミング\nボールをとらえる位置\n体の正面でボールを処理する\n安全で確実なキャッチングと着地',
     notes:'あわてない\nボールの軌道を見きわめさせる\n判断しやすいボールをサーブする\nはじめはフォームを身につけ、少しずつジャンプを高くする'},
    {id:'p3-g8',src:sw,ages:U14,name:'GK：デイリーワーク（さまざまなステップ）',cats:['wup'],themes:['コーディネーション','ポジショニング'],gk:true,size:'フリー',equip:['ボール','コーン','マーカー'],
     method:'（1）スラローム：コーンの間をぬって進み、サーブされたボールをキャッチ\n（2）前後ステップ・もも上げステップ：マーカーを前後にまたぎながら横へ進む\n（3）前後ステップ：前へ出てキャッチ → 下がる、をくり返す\n（4）バッククロスステップ：ななめ後ろのマーカーへ下がってキャッチ\n（5）バックステップ＋バッククロスステップ：下がりながら、山なりのボールをキャッチ'},
    {id:'p3-g9',src:sw,ages:U14,name:'GK：パス＆サポート（4対1 → 4対2）',cats:['tr1'],themes:['配球','ビルドアップ'],gk:true,size:'30m×30m',equip:['ボール','ゴール','コーン'],
     method:'（1）GKを入れた4対1 → 4対2で、ボールを保持する\n（2）キャッチ → パス＆サポート → パス\nアンダーアームスロー → パス\nオーバーアームスロー → ミドルパス',
     keys:'観る（状況をつかむ）\n攻撃の優先順位\nサポートの質（距離、角度、タイミング）\n体の向き\nファーストタッチ\nコミュニケーション（味方との連携）\nパスの質\n危険を冒さない',

     method:'コーチがボールを出したら、1対1がスタート\n攻撃は、3mのゾーンより手前でコントロールする\n（1）攻撃は、ゴールエリアのラインを突破する\n（2）攻撃は、ドリブル突破かシュート\n（3）攻撃の持ち出しは自由\n発展：スルーパスへの対応（サイド、中央）。GK対FWの1対1 → DFを入れる',

    {id:'p3-g11',src:sw,ages:U14,name:'GK：クロスへの対応（パンチングとキャッチ）',cats:['tr1'],themes:['クロス対応'],gk:true,size:'ペナルティエリア',equip:['ボール','ゴール','コーン'],opIds:['p3-g7'],

    {id:'p3-r2',src:jc('【2対1の前進・フィハール3選】小学1〜2年生から','2vs1-fijar'),ages:['U-8','U-10'],name:'2対1の前進（引きつけてパス）',cats:['tr1'],themes:['ビルドアップ','ボールを運ぶ（ドリブル）'],minutes:15,size:'12m×20mくらい',equip:['ボール','マーカー'],
     method:'2対1でスタート。攻撃は相手を引きつけてパスを出すか、パスコースを切られたらドリブルで運ぶ\n前方で待っている選手へパスを出したら、パスを出した選手が守備役になる\nパスを出さなかったほうの選手は、コートから出て列の後ろへ\n守備が奪ったら、待っている選手のどちらかへパス。その時は、近いほうの攻撃の選手が守備役になる\nオフサイドラインを設定してもよい',
     keys:'ボールを持った選手は、守備に向かってドリブルする\nサポートの選手がいる方向へはドリブルしない\nパスが守備の足に当たらないよう、引きつけすぎない\nパスコースを切られたら、体をサポートの選手へ向けてパスを意識させながら、運ぶドリブルではがす\nサポートの選手は、ボールを持った選手に近づかない',
     notes:'簡単な判断をくり返せるので、低学年からできる\nゴールを置いて、ビルドアップやフィニッシュの形にしてもよい'},
    {id:'p3-r3',src:jc('【壁パスとドリブルの使い分け】1対1+1フリーマン','1on1-1freeman-pared-regate'),ages:['U-8','U-10'],name:'1対1＋フリーマン（壁パスとドリブルの使い分け）',cats:['tr1'],themes:['コンビネーション','ボールを運ぶ（ドリブル）'],minP:3,minutes:20,size:'15m×20mくらい',equip:['ボール','マーカー','ビブス'],
     method:'守備役は、ラインAからドリブルでスタートして、攻撃の選手へパスする\n攻撃は、フリーマンとの壁パスか、ドリブルで突破する。前方のラインを通過したら成功\n守備が奪ったら、ドリブルで反対側（B）のライン突破を目指す\nフリーマンは1タッチ（ダイレクト）でプレーする',
     keys:'パスするふりをしてドリブル、ドリブルするふりをしてパス\n相手を引きつけてから動く\nスピードを変える（ゆっくりから速く）\n相手が前がかりになった瞬間をねらう\nサポートの選手がいる側へは抜きにかからない\n壁パスのリターンは、スペースへ出す',
     notes:'低学年では、壁パスのあとにパスを出した方向へ走らないことが多い。守備の背中側を走る\nフリーマンを続けて行うので、サポートの位置を直しやすい'},
    {id:'p3-r4',src:jc('【2対1の崩し&シュート】攻守の切替付き','2vs1-shoot-transition'),ages:[],name:'2対1の崩し＆シュート（切りかえつき）',cats:['tr1','tr2'],themes:['ゴールを奪う（シュート）','コンビネーション','攻→守'],gk:true,minutes:15,size:'20m×15mくらい',equip:['ボール','ゴール','マーカー'],
     method:'① 片方の攻撃の選手が、ドリブルからシュート\n② 同時に、コーチがもう片方の攻撃の選手へ配球\n③ 守備役はすばやく飛び出す。シュートを打った選手もサポートに入り、2対1がスタート\n④ 守備は奪ったら、コートの外へドリブルするか、コーチへパスして終了\n⑤ 奪われたら、攻撃側はすぐ取り返しに行く\n守備側は下がらずに、ボールを奪いに行く',
     keys:'シュートのあと、すぐ次の動き（サポート）へ移る\n守備を引きつけてからパスを出す\nコントロールで守備のラインをこえる（足元に止めない）\nパスとドリブル、両方の選択肢を持つ\n奪われた瞬間に切りかえる'},
    {id:'p3-r5',src:jc('【3対3+GKミニゲーム】前線のプレッシング','3vs3-2gk-small-game'),ages:[],name:'3対3＋GKミニゲーム（前線からの守備）',cats:['game','tr2'],themes:['ボールを奪う','チャレンジ＆カバー'],minP:8,maxP:8,gk:true,minutes:15,size:'30m×20mくらい',equip:['ボール','ゴール','マーカー','ビブス'],
     method:'ふつうのゲーム。中央のラインをオフサイドラインにする\nゴールが決まったら、GKからスタート\nタッチラインを出たら、キックインで再開\n攻撃側は、GKも使ってビルドアップする\n2〜3分×5本',
     keys:'最初のアプローチは、ドリブルで抜かれないことを第一にする\nGKへ下げられたら、そのまま寄せるならコースを切りながら。ほかの選手はパスカットをねらう\n中を閉じて、パスを外へ誘導する\nパスが出るタイミングでアプローチする\nインターセプトをねらい、収められたらドリブルへの対応に切りかえる',
     notes:'はじめからパスコースを切りながら寄せると、ドリブルのスペースを空けて前へ運ばれる\nパスが出る前に人に食いつくと、スペースを空けてしまう'},
    {id:'p3-r6',src:jc('【1対2の守備】攻撃を遅らせるディレイ','delay-2vs2'),ages:[],name:'1対2の守備（ディレイ）',cats:['tr1'],themes:['ゴールを守る','チャレンジ＆カバー'],minutes:20,size:'15m×25mくらい',equip:['ボール','マーカー','コーン'],
     method:'攻撃の2人は、守備の選手をかわして、前方で待っている選手へパスする。そのあと守備役になる\nパスを出した選手は、中央のコーンを回ってから守備に入る（はじめは1対2、遅れて2対2になる）\n守備が奪ったら、後方のグループへパス\n攻撃側は、時間をかけずに攻める',
     keys:'守備：1対2の時は寄せすぎず、パスでこえられない距離を取る\n守備：パスが出ても寄せられる位置を取る\n守備：味方の戻りが遅れてゴールに近づかれたら、パスコースを切りながら寄せる\n守備：味方が戻ってきたら、ふつうの2対2の守備をする\n攻撃：サポートの選手は、プレスを受けていない時は相手のラインをこえた位置を取る\n攻撃：パスする時は、相手を引きつける',

    {id:'p3-r7',src:jc('【3対2の攻撃】数的優位からの崩しを学ぶ','3vs2-ataque'),ages:[],name:'3対2の攻撃（数的優位からの崩し）',cats:['tr2'],themes:['ゴールを奪う（シュート）','コンビネーション','クロス'],minP:6,gk:true,minutes:25,size:'40m×30mくらい',equip:['ボール','ゴール','マーカー','ビブス'],

     keys:'サイドを崩す：ボールを持った選手は、2対1を使うために守備を引きつける\nサイドを崩す：カットインするふりをして、オーバーラップした選手をフリーにする\nサイドを崩す：オーバーラップする選手は、スピードを上げる\nサイドを崩す：逆サイドの選手は、守備がサイドにつられたのを見て、スペースへ入る\nカットイン：オーバーラップした選手を使うフェイントを入れ、一気にスピードを上げて2人目の守備を引きつける\nカットイン：中を警戒されたら、オーバーラップした選手を使う'},

    {id:'p4-a9',src:sw,ages:U14,name:'1対1＋クロッサー＋GK',cats:['wup'],themes:['クロス','ゴール前の攻防'],gk:true,size:'ペナルティエリアのまわり',equip:['ボール','ゴール','マーカー','ビブス'],
     method:'サイドの選手は、ワンツーをしてからクロスを入れる\n中は、1対1＋GKで対応する\n攻撃側には、ニアとファーの使い分けを働きかける\n左右、2回続けて行う\nGKはキャッチしたら、コーチか休んでいる選手へパス\nオプション：中を2対2にする',
     keys:'守備：ポジショニング（ボールと相手を同時に観る）／相手より先にさわる／シュートブロック／GKとの連携（プロテクションとカバー）\n攻撃：キックの質／マークを外す／クロスの質と入り方（ニア、ファー）／リバウンドの意識',
     gkPoints:'観る（状況をつかむ）\nスタートポジション\nプレーの判断（出るか、とどまるか）\n味方との連携\nテクニックの選択（キャッチング、パンチング）'},
    {id:'p4-a10',src:sw,ages:U14,name:'6対6＋2クロッサー',cats:['tr2'],themes:['クロス','ゴール前の攻防'],minP:14,maxP:14,gk:true,size:'48〜50m×40m、両サイドに幅10mのゾーン',equip:['ボール','ゴール','マーカー','ビブス'],opIds:['p3-w19'],
     method:'1-3-2＋クロッサー2人で行う\nアウトオブプレーはGKからスタート\nクロッサーは2タッチ以下でプレー。シュートあり、オフサイドあり\nサイドのゾーンには、攻守1人ずつ入る\nGKから直接クロッサーへのパスはなし（流れの中ではOK）',
     keys:'守備：ポジショニング（ボールと相手を同時に観る）／相手より先にさわる／マークの受け渡し／シュートブロック／GKとの連携／リスク管理\n攻撃：優先順位（シュートの意識）／クロスの質と入り方／マークを外す／動き直し／リバウンドの意識',
     notes:'ボールと相手を同時に観て、相手より先にさわることを基本にする\nボールがサイドの深い位置に入った時は、危ないスペースを埋めながら対応する'},
    // ---- 女子U-14 2026：フィジカル ----
    {id:'p4-f1',src:sw,ages:U14,name:'ムーブメントプレパレーション（動きづくり5種）',cats:['wup'],themes:['コーディネーション'],size:'フリー',
     method:'ウォーミングアップの動きづくりとして行う\n① バックランジローテーション：後ろのひざを曲げる。腰をそらない。体の軸を意識する\n② フォワードランジハムストリング：後ろのひざを伸ばす。前のひざを固定する\n③ インバーテッドハムストリング：地面と平行まで倒れる。前のひざは軽く曲げる\n④ バックランジサイド：後ろのひざを曲げる。腰をそらない。腕をまっすぐ伸ばす\n⑤ フォワードランジローテーション：後ろのひざを伸ばす。前のひざを固定する。指先を見る',
     keys:'背中をまっすぐに保つ（背を高く）\nおなかを少しへこませて行う\nおしりをしめるように意識する'},
    {id:'p4-f2',src:sw,ages:U14,name:'ステップワークドリル（6種）',cats:['wup'],themes:['アジリティ','コーディネーション'],size:'フリー（複合ステップはマーカー5つ＋5m先）',equip:['マーカー'],
     method:'① 足幅の設定：かかとをつけてつま先を開き、いちばん反発をもらえる足幅を見つけて、軽くジャンプ\n② 前後ステップ：上半身は正面のまま、足幅を変えずに前後へ。外側の足の親指のつけ根で地面を押す\n③ クロスステップ：前向きを保ち、視線を動かさずに、前後へ左右のクロスステップ\n④ サイドステップ：頭の位置を変えず、内側の足を体の下に置いて左右を入れ替える\n⑤ 複合ステップ：5つのマーカーをサイドステップで進み、5m先のマーカーで前後ステップやクロスステップ。トップスピードからの減速を意識する\n⑥ 守備対応のステップ：前後ステップを横向きで行い、後ろ足で方向転換。前方へ誘導して奪う。対面パスからの1対1へつなげる',
     notes:'ボールを使うウォーミングアップの前に行う\nそのあとのトレーニングで使うステップを選ぶ（例：ゴールを目指す日は足幅・前後・サイド、ボールを奪う日は足幅・クロス・守備対応）'},
    {id:'p4-f3',src:sw,ages:U14,name:'バランス／アジリティ（ジャンプとシャトルラン）',cats:['wup'],themes:['アジリティ'],size:'フリー',equip:['マーカー'],
     method:'① スクワットジャンプ：スクワットの形から跳び、空中で足から頭まで一直線。スクワットの形で着地する\n② 回転ジャンプ：片足の姿勢から90度ずつ回りながら4回跳び、片足スクワットで着地する\n③ サイドホップ：片足スクワットから横へ跳んで着地。バランスをくずさない\n④ クロスホップ：片足スクワットから、外側の足を体の前でクロスさせて逆側へ跳ぶ\n⑤ シャトルラン：一定の距離をスプリントし、マーカーで切り返す。切り返しの向きは一方向に決める（左右両足で切り返すため）',
     notes:'股関節を曲げ、おしりの筋肉を使って着地する\n切り返しでは内側の足に体重を残し、かかとから着かない\nひざがつま先より内側に入る着地や、体重が後ろにかかる着地は、ひざのけがにつながりやすい'},
    // ---- 女子U-14 2026：GK ----
    {id:'p4-g1',src:sw,ages:U14,name:'GK：対面パスと配球の技術（スローとキック）',cats:['wup'],themes:['配球'],gk:true,minP:2,size:'11m／22m／33m',equip:['ボール','マーカー'],
     method:'2人1組で対面パス。距離を変えて行う\n① 対面パス、アンダーアームスロー：11m\n② プレスキック（グラウンダー）：22m\n③ オーバーアームスロー：22m\n④ プレスキック（ライナー）、サイドボレー：33m\n⑤ 3人1組でパスとコントロール：22m\nテクニックのレベルが近いどうしで組む',
     keys:'コミュニケーション\nコントロールの質（ファーストタッチ）：パスコースに入る、軸足の位置、面の作り方、とらえる位置\nパスの質：軸足、テイクバック、ミート、フォロースルー、強さ、方向、軌道',
     notes:'サイドボレー：踏みこみ足、リリースポイント、離すタイミング、当てる面の固定、上体を軸足側に傾ける\nオーバーアームスロー：握り方、逆の手の使い方、踏み出す足、腕の振り、フォロースルー'},
    {id:'p4-g2',src:sw,ages:U14,name:'GK：パス＆サポート（幅と深さの役割つき）',cats:['tr1'],themes:['配球','ビルドアップ'],gk:true,size:'33〜40m×40m',equip:['ボール','ゴール','コーン','マーカー'],opIds:['p3-g9'],
     method:'ボールを持っている選手がGK役。ほかの選手は、幅を作る選手（CBやSB）、深さを作る選手（ボランチやFW）として、サポートのポジションを取る\n中央の選手は、ボランチ役から相手FW役（1人）に変わる\n発展：相手FW役にコーチも入り、2人にする',
     keys:'相手を観た、オフのポジショニング\n相手を見た、テクニックの選択と実行\n両足を使う\n続けて関わる\nコミュニケーション\n試合を想定したプレー選択（背後のゴールを意識する）\n攻撃方向を意識したパスの質'},
    {id:'p4-g3',src:sw,ages:U14,name:'GK：ディストリビューション（キャッチから配球）',cats:['tr2'],themes:['配球'],gk:true,size:'55m×25m',equip:['ボール','ゴール','コーン','マーカー','ビブス'],
     method:'① GK＋1対1（ラインゴール）：コーチが配球したボールをGKがキャッチしてから攻撃を始め、ラインを通過する\n② コーチの配球をキャッチし、中央のボランチ役へオーバーアームスローで配球する\n③ コーチの配球をキャッチし、中央のFW役へサイドボレーで配球する',
     keys:'ターゲットを見る（肩ごし）\n観る\nコミュニケーション\n攻撃の優先順位\nテクニックの選択\nパスの質'},
    {id:'p4-g4',src:sw,ages:U14,name:'GK：ピックアップとフロントダイビング',cats:['tr1'],themes:['ブレイクアウェイ'],gk:true,size:'ゴール前',equip:['ボール','ゴール'],opIds:['p3-g6'],
     method:'ピックアップ：前へ出て、転がってくるボールを拾い上げる（状況を説明してから行う）\nフロントダイビング：3人が横に並び、ななめ前のボールへ飛びこむ',
     keys:'ピックアップ：動き出し（タイミング、方向）／体の正面でとらえる／手の出し方／ボールの後ろに手を置く／ひざの曲げ方\nフロントダイビング：開始姿勢／構えるタイミング／アプローチのコース／間合い／踏み切り／面を作る／とらえる位置／声',
     notes:'ピックアップ：ボールの後方から手を出す。曲げているひざは地面につけず、足の裏を地面につける。キャッチのあとは、FWとぶつからないよう横によける\nフロントダイビング：GKとボールの角度が、縦方向になりすぎないようにする。捕ったあとのブロッキングも確認する'},
    {id:'p4-g5',src:sw,ages:U14,name:'GK：1対GK（出るか、飛びこむかの選択）',cats:['tr2'],themes:['ブレイクアウェイ'],gk:true,size:'16.5m×10m',equip:['ボール','ゴール','マーカー','コーン'],opIds:['p4-g4','p3-g10'],
     method:'コーチの配球に対して、GKはピックアップかフロントダイビングかを選んで実行する\nFW役はコーチの横からスタートし、スプリントでボールへ寄せる（実戦に近づける）\n戻りメニュー：GKはPKマークからスタート。FW役は、地面に置いたボールから1対1を始める\n戻りメニューの得点：① ゴールエリアのラインをドリブル通過　② コーンゴールへのシュートもあり\nコーチは1プレーの時間を決める（5秒を数えながら）',
     keys:'開始姿勢\n動き出し（タイミング、方向）\nテクニックの選択（ピックアップ、フロントダイビング）\n安全で確実なプレー\n構えるタイミングと姿勢（重心、腕と手の位置、スタンス）\nボールに正対する\n奪えるチャンスを逃さない\n相手の動きではなく、ボールを注視して対応する',
     notes:'姿勢を保ち、正対したまま対応する（ドリブルに対応できるスタンス）\nダイビングを決断したら、100%つかむ\n股下への対応は、ひざを地面につけない'},
    {id:'p4-g6',src:sw,ages:U14,name:'GK：クロス（ワンタッチのクロスに対して）',cats:['tr1'],themes:['クロス対応'],gk:true,size:'ペナルティエリア（クロスはゴールエリアの外10mあたりから）',equip:['ボール','ゴール','コーン'],opIds:['p3-g7'],
     method:'選手のキックで配球する\n① Sの位置から、Aの位置のキッカーへパス。そのパスをワンタッチでクロス\n② Sの位置から、Bの位置のキッカーへパス。そのパスをワンタッチでクロス\nキャッチして着地したら、クロッサーへ正確なスローかキックで返す\nキッカーの状況に応じて、配球のやり方を変える。左右どちらも行う',
     keys:'スタートポジション\n開始姿勢\n動き出し（タイミング、方向）\nジャンプの動作\n空中姿勢\nボールをとらえる位置\n手の形（1回でつかむ）\n着地',
     notes:'強く勢いよく地面を踏み切る。振り上げる足と腕の振りも使う\n振り上げた足は、地面と水平まで上げて相手をブロックする。すぐに下げない\nボールを前方でとらえ、キャッチしたら抱えこむ\nボールの位置（角度と距離）とFWの位置をイメージさせて、ポジショニングにふれる'},
    {id:'p4-g7',src:sw,ages:U14,name:'GK：カットバックへの対応',cats:['tr1'],themes:['クロス対応','シュートストップ'],gk:true,size:'ペナルティエリア',equip:['ボール','ゴール','コーン','マーカー'],
     method:'選手のキック（止まったボール）で、①②の方向へ配球する\n① Sの位置から、Aのマーカーをねらってパス。GKがボールへ出る\n② Sの位置から、Bのマーカーをねらってパス。FW役が、そのパスをシュートする\n状況を説明してから行う。左右どちらも行う',
     keys:'スタートポジション\n開始姿勢\n構えるタイミングと、その姿勢\n動き出し（タイミング、方向）\nプレーの方向\nとらえる位置\nすばやい移動（ステップの切りかえ）\nテクニックの選択（キャッチングか、ディフレクティングか）\n安全で確実なプレー',
     notes:'①は、ボールに対してアタックする（プレーの方向）\n②は、クロスステップからサイドステップへの切りかえを伝える\nキッカーのボールの質にもふれる\nコーチがやって見せる'},

     keys:'サポートの前にフェイント（マークを外す動き）を入れ、タイミングを合わせる\nマークされたら、別のスペースへ移動する\nスペースへの移動は、ボールに近い選手から行う',

    {id:'p4-c2',src:jc('【数的同数でもパスが回る】６対６のポゼッション','6vs6-possession'),ages:[],name:'6対6のポゼッション',cats:['tr2'],themes:['ポゼッション'],minP:12,maxP:12,minutes:20,size:'30m×30mくらい',equip:['ボール','マーカー','ビブス'],
     method:'攻撃チームは、ボールを失わないように保持する\n守備チームが奪ったら攻守交代\nボールが外に出たら、コーチの配球で再開する',
     keys:'攻撃に移ったら、必ずスタートポジションを取る（ボールを持った選手に対して、両サイド、中央、遠く）\nフリーなら、動く必要はない'},
    {id:'p4-c3',src:jc('中盤で数的優位を作る【７対５ポゼッション】','7vs5-possession'),ages:[],name:'7対5ポゼッション（3ゾーン）',cats:['tr2'],themes:['ビルドアップ'],minP:12,maxP:12,minutes:20,size:'25m×40mくらい（3つのゾーン）',equip:['ボール','マーカー','ビブス'],
     method:'ゾーン1と3は2対1、ゾーン2は3対3でスタート\nゾーン1の攻撃の選手は、ドリブルでだけゾーン2へ入れる\n守備は、ほかのゾーンへ移動できない\n攻撃は、ゾーン1 → 2 → 3への前進を目指す\nゾーン3まで行ったら折り返して、ゾーン1への前進を目指す',
     keys:'ボールを持った選手は、縦へのドリブルやパスを意識させて、守備を引きつける\nもう1人は、パスを受けても相手にプレッシャーを受けない位置でサポートし、余裕を持ってゾーン2へ入る',
     notes:'サポートが近いと、守備に「二度追い」されて前進できない\nゾーン1はセンターバックのイメージ。まず2人で相手の1人をこえる'},
    {id:'p4-c4',src:jc('【数的優位・エントレリネアス】4vs4+2サーバー(2ゾーン)のポゼッション','4v4-2server-2zone-possession-practice-menu'),ages:['U-12'],name:'4対4＋2サーバー（2ゾーン）',cats:['tr2'],themes:['ポゼッション','ビルドアップ'],minP:10,maxP:10,minutes:15,size:'20m×30mくらい（2つのゾーン）',equip:['ボール','マーカー','ビブス'],
     method:'各ゾーンは2対2＋サーバー1人\nボールのある側から見て奥のゾーンの攻撃は、1人だけ手前のゾーンに入れる（攻撃は各ゾーン最大3人）\n守備はゾーンをまたげない\nサーバーからサーバーへの前進を目指す\n守備が奪ったら攻守交代\nなれたら、守備も1人だけゾーンをまたげるようにする',
     keys:'サイドの選手は、ポジショニングと方向づけたコントロールで、守備のラインをこえる（「相手の後ろへ行く」）\n2人で前進できない時は、奥の選手が降りてきて数的優位を作る\n味方の動きに合わせて、自分のポジションを変える'},
    {id:'p4-c5',src:jc('プレッシングの基本を学ぶ練習メニュー【5対3のポゼッション】小学4〜6年生','5-3-pressing'),ages:['U-10','U-12'],name:'5対3のポゼッション（プレッシングの導入）',cats:['tr1'],themes:['ボールを奪う','チャレンジ＆カバー'],minP:8,maxP:8,minutes:20,size:'15m×20mくらい（まん中で2つに分ける）',equip:['ボール','マーカー','ビブス'],
     method:'5対3だが、片方のコートで4対3からスタート。もう片方のコートに攻撃が1人いる\nその1人へボールが渡ったら、全員がそちらのコートへ入り、また4対3で前進を目指す\nはじめは、中央のラインはドリブル通過のみ\n守備が奪ったら、奪われた選手と交代する（または、いちばん長く守備をしている選手が攻撃へ）\n守備は下がらずに、前へ出て奪いに行く',
     keys:'相手の中央の選手がボールを持ったら、守備も中央の選手がプレスに行く\nサイドに入ったら、逆サイドはカバーを意識しながら、2つのパスコースをねらう\nギャップを閉じながら、サイドへ誘導してねらう'},
    {id:'p4-c6',src:jc('組織的プレスでボール奪取【8対4】サッカー守備の練習メニュー','8-4-pressing'),ages:[],name:'8対4（4対4＋4フリーマン）組織的なプレス',cats:['tr2'],themes:['ボールを奪う','チャレンジ＆カバー'],minP:12,maxP:12,minutes:25,size:'30m×40mくらい',equip:['ボール','マーカー','ビブス'],
     method:'4対4＋両はしにフリーマン2人ずつ（3チームでローテーション）\n攻撃は、片方のフリーマンから中盤を経由して、反対側のフリーマンへの前進を目指す。届いたら折り返す\nフリーマンどうしのパスやロングパスもOK。はじめはグラウンダーのみ\n守備は奪ったら、反対方向の選手へパスして、また守備を行う（攻守交代なし）\n5〜8分で守備役を交代する',
     keys:'フリーマンがボールを持っている時は、中央の選手がプレスをかける（サイドの選手は行かない）\n中央が前へ出たら、後方の選手は距離をちぢめてギャップを閉じる\nサイドへ出たらプレス。となりの選手は、カバーとパスカットをねらう\n常に、となりの選手とのユニットで考える\nボールから遠いサイドは、深いカバーを取らず、ラインをそろえる'},
    {id:'p4-c7',src:jc('コンビネーションと動きの質を高める【3対３+1】','3vs3plus1-attack'),ages:[],name:'3対3＋1（コンビネーションと動きの質）',cats:['tr2'],themes:['コンビネーション'],minutes:20,size:'30m×20m',equip:['ボール','マーカー','ビブス'],
     method:'攻撃側フリーマンの配球からスタート\n攻撃は、コンビネーションなどで守備のラインを突破する（手前のフリーマンに下げてもよい）\n前進したら、奥にいる味方へパスして交代する。受けた選手はそのままコートに入り、また3対3＋1で突破を目指す\n守備は奪ったら、両外にいるフリーマンへパス。パスした選手が外に出て、受けた選手がコートに入る\n守備側は、ハーフラインより高い位置でプレスをかける',
     keys:'ボールを持った選手は、味方がポジションを取る時間を作る\nパスしたあとの動き（裏へ抜ける、オーバーラップ）を出す\n2人の関係だけで崩そうとしない'},
    {id:'p4-c8',src:jc('【攻守の切替を鍛える】2+2vs2（3色ビブス）ロンド','soccer-training-2-2vs2-rondo-transition'),ages:['U-10','U-12'],name:'2＋2対2ロンド（3色・切りかえ）',cats:['wup','tr1'],themes:['ポゼッション','攻→守'],minP:6,maxP:6,minutes:15,size:'10m×10mくらい',equip:['ボール','マーカー','ビブス'],
     method:'2人1組の3チームに分かれ、色ちがいのビブスを着る\n攻撃4人（2チーム）と守備2人（1チーム）でボール回し\n守備が奪ったら、奪われたチームが次の守備になる\n止めずに、続けて行う\nタッチ数の制限はなし\n3人1組（9人）の6対3でもできる',
     keys:'パスコースを複数作る。味方がプレーしやすいパスを出す\n攻撃しながら「失ったら」を予測し、すぐ守備に切りかえられる体の向きと位置を取る'},
    {id:'p4-c9',src:jc('【5vs2ロンド(変則)】局面で数的優位を作る','variable-5v2-rondo-training'),ages:['U-12'],name:'5対2ロンド（中央の選手が動く）',cats:['tr1'],themes:['ポゼッション'],minP:7,maxP:7,minutes:15,size:'12m×12mくらい',equip:['ボール','マーカー','ビブス'],
     method:'攻撃は外に4人、中央に1人\n中央の選手が位置を動かして、全体のポジショニングを調整し、パスコースを作る\n守備が奪ったら攻守交代\n中央の選手は「自分へのパスコースを切られたら、次のパスコースを予測して動き出す」\n5対3にしてもよい',
     keys:'中央の選手は、直接もらえないと感じたら、次に展開される選手を予測して位置を変える\n中央の選手が降りてきた場所にいる選手は、位置を上げる（ポジションチェンジ）\nボールから遠いサイドの選手が中央のスペースを埋め、全体のバランスを取る'},
    {id:'p4-c10',src:jc('【2vs2+2サーバー ロンド】マークを外す動き&カットイン','2v2-2server-rondo'),ages:['U-10','U-12'],name:'2対2＋2サーバー ロンド（方向あり）',cats:['tr1'],themes:['ポゼッション','コンビネーション'],minP:6,maxP:6,minutes:15,size:'12m×14mくらい',equip:['ボール','マーカー','ビブス'],
     method:'サーバーは両はしのライン上に立ち、横方向にだけ動く\n攻撃は2人のサーバーを使いながら保持し、反対側のサーバーまでボールを届けたら成功\nサーバーからサーバーへの直接のパスもOK\n守備は奪ったら、攻撃側と交代する\nドリブル突破をありにするかどうかで、ねらいを調整する',
     keys:'攻撃：パスを出したら、すぐ次のサポートに入るか、守備の背後をねらう\n守備：2人の間（ギャップ）を警戒しながら、タイミングよくアプローチする。1人が行ったら、もう1人がカバーする'},
    {id:'p4-c11',src:jc('2vs2+1ロンド【攻守の切替が鍵】','2vs2-plus-1-rondo-switching-drill'),ages:['U-10','U-12'],name:'2対2＋1ロンド（切りかえ）',cats:['wup'],themes:['ポゼッション','攻→守','守→攻'],minP:5,maxP:5,minutes:10,size:'7m×7mくらい',equip:['ボール','マーカー','ビブス'],
     method:'攻撃2人とフリーマン1人で、グリッド内でボールを保持する\nフリーマンは、いつも攻撃側の味方\n守備2人が奪ったら、そのまま攻撃になり、失った側が守備に切りかわる\nタッチ制限はなし\nフリーマンは時間で交代するとよい',
     keys:'パスコースがない時は、止まらずにドリブルでスペースへ運び、時間を作る\nコントロールの前にフェイントを入れ、次の動きを読まれにくくする\n奪った直後は中央に寄っていることが多い。まず運ぶか、一度あずけてから広がる',
     notes:'切りかえが続くので負荷が高い。フリーズをうまく使って休ませる'},
    {id:'p4-c12',src:jc('ポジションチェンジを繰り返す【５対２のロンド】','5vs2rondo-position-change'),ages:[],name:'5対2ロンド（ポジションチェンジ）',cats:['tr1'],themes:['ポゼッション'],minP:7,maxP:7,minutes:20,size:'15m×15mくらい',equip:['ボール','マーカー','ビブス'],
     method:'攻撃は外側に4人、中央に1人\nパスを出した選手は、必ず自分がいたスペース以外の場所へ移動する\nほかの選手は、状況に合わせて空いたスペースへ移動する（位置が重ならないように）\nパスコースがない時は、ドリブルでほかのスペースへ入ってよい\n守備は奪って、コートの外へ持ち出したら攻守交代',
     keys:'ボールは間接視野に入れ、味方の動きを見る（ボールを見る → 味方を見る、をくり返す）\n味方がドリブルで近づいてきたら、オーバーラップでスペースを出る。必ずボールを持った選手の後ろを通る\n味方が位置につく前にパスを出さない（受け手が体の向きを作れない）'},
    {id:'p4-c13',src:jc('連続したサポート【3対2＋1対1のロンド】','3vs2-1vs1-rondo'),ages:[],name:'3対2＋1対1のロンド（連続したサポート）',cats:['tr1'],themes:['ポゼッション','ビルドアップ'],minP:7,maxP:7,minutes:15,size:'15m×25mくらい（まん中で2つに分ける）',equip:['ボール','マーカー','ビブス'],
     method:'片方のゾーンは3対2、もう片方は1対1でスタート\n攻撃は各ゾーンに3人まで、守備は2人まで入れる\n攻撃は、ドリブルやパスで別のゾーンへ入れる\n守備が奪って、コートの外へ持ち出したら終了。奪われた選手と攻守交代',
     keys:'奥の選手は、上下左右に動いて守備を動かし、パスラインを作る\n守備が前にいる時は、出し手がパスを出せるタイミングで降りる。後ろにいる時は、フェイントを入れてパスコースを作る\n自分にパスが出なかったら、すぐ動き直して次のパスコースを作る'},
    {id:'p4-c14',src:jc('エントレリネアスと背後を狙う動き【5vs5+2サーバーのポゼッション（前進型）】','soccer-training-menu-5vs5-2server-possession-forward'),ages:['U-12'],name:'5対5＋2サーバー（前進型のポゼッション）',cats:['tr2'],themes:['ポゼッション','ビルドアップ'],minP:12,maxP:12,minutes:15,size:'25m×35mくらい',equip:['ボール','マーカー','ビブス'],
     method:'攻撃は、バランスよくスタートポジションを取る。そのあとは移動してよい\nサーバーからサーバーへの前進を目指す\n守備が奪ったら攻守交代\nスペースを認識させるため、必ず同数で行う（フリーマンは入れない）\n攻撃は、サーバーにボールが渡ったら必ずスタートポジションを取る',
     keys:'スタートポジションと位置の微調整で前進できるなら、ポジションを動かさない\nまず、ポジショニングや方向づけたコントロールで「守備のラインをこえる」ことをねらう\n中央の選手が、サーバーとサイドの間に降りる動きが、流動性のきっかけになる\nライン間の選手がフリーならそこへ。守備が食いついたら、サイドの選手が背後をねらう',
     notes:'まず自由にプレーさせて、スタートポジションが取れるかを観る\nサーバーには、ショートパスとロングパスの両方を同時に考えさせる'},

     method:'コーチの配球でスタート\n守備側は奪ったら、相手のゾーンへドリブルかパスで入る。1人は攻撃に参加してよい（4対3）\nひどいオフサイド以外は取らない\n別の回：フリーマンを入れる。ゾーンをこえての進入はなし',
     keys:'いつもシュートを意識する。選択肢を持った仕掛け\nオフの選手のアクション、関わり。コンビネーション\n奪われたあとの連続したプレス。縦をおさえる\n奪ったあとのカウンター。幅と深さ\n逆のゾーンの準備。リスク管理\n幅をせばめたチャレンジ＆カバー（ゴール前）'},

// お手本の図に「体の向き」を足す。自分で描きなおした図はさわらない（向き以外が元のままの図だけ入れかえる）
async function upgradeSeedFigs(){
  const strip=b=>JSON.stringify([b.field,b.items.map(it=>it.t==='p'?{...it,rot:0}:it)]);
  for(const s of seedData().cards){const c=card(s.id);
    if(c&&c.images.length===s.images.length&&c.images.every((im,i)=>im.board&&strip(im.board)===strip(s.images[i].board))){c.images=s.images;await dbPut('cards',c);}}
}
// 図のなかったころのお手本カードに、図を足す（自分で図を入れたカードはさわらない）
async function addSeedFigs(){
  for(const s of seedData().cards){const c=card(s.id);if(c&&!c.images.length&&s.images.length){c.images=s.images;await dbPut('cards',c);}}
}
// はじめから入っているひな型が書きかえられていたら、元の中身にもどす
async function restoreSeedPlans(){
  const sig=p=>JSON.stringify([p.title,p.theme,p.age,p.players,p.totalMin,p.review,p.slots.map(s=>[s.cat,s.cardId,s.minutes,s.memo])]);
  for(const sp of seedData().plans){const p=plan(sp.id);
    if(p&&p.template&&sig(p)!==sig(sp)){Object.assign(p,{title:sp.title,theme:sp.theme,age:sp.age,players:sp.players,totalMin:sp.totalMin,review:'',done:false,slots:sp.slots});await dbPut('plans',p);}}
}
async function putSeed(){
  const sd=seedData();
  await ensureThemes(sd.cards.flatMap(c=>c.themes));
  for(const c of sd.cards){if(!card(c.id)){S.cards.push(c);await dbPut('cards',c);}}
  for(const p of sd.plans){if(!plan(p.id)){S.plans.push(p);await dbPut('plans',p);}}
}

function themeOptions(sel,emptyLabel){
  const groups=[...new Set(S.themes.map(t=>t.group))];

}
const opt=(list,sel,emptyLabel)=>`<option value="">${esc(emptyLabel)}</option>`+list.map(([v,l])=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`).join('');
function matchPlayers(c,n){return n==null||((c.minP==null||c.minP<=n)&&(c.maxP==null||n<=c.maxP));}
function matchCard(c){
  if(F.cat&&!c.cats.includes(F.cat))return false;
  if(F.theme&&!c.themes.includes(F.theme))return false;
  if(F.age&&c.ages.length&&!c.ages.includes(F.age))return false;
  if(F.src&&c.src.type!==F.src)return false;
  if(F.fav&&!c.fav)return false;
  if(!matchPlayers(c,num(F.players)))return false;
  if(F.q){const hay=[c.name,c.themes.join(' '),c.method,c.keys,c.notes,c.memo,c.size,c.src.title].join(' ').toLowerCase();
    if(!F.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w)))return false;}
  return true;
}
const badges=c=>c.cats.map(k=>`<span class="badge cat-${k}">${catLabel(k)}</span>`).join('');
function cardMeta(c){
  const p=c.minP!=null||c.maxP!=null?(c.minP===c.maxP?`${c.minP}人`:`${c.minP??''}〜${c.maxP??''}人`):'';

}

function shrink(file,m=1400){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');
    cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',.85));};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('画像を読みこめません'));};im.src=url;});}

/* ========== 写真・PDFからのよみとり（Gemini） ========== */
// APIキーは端末の localStorage にだけ置く（書き出しJSONには入れない）
const LSK='renshu-base.gemini',LSM='renshu-base.geminiModel',GEMINI_MODEL='gemini-2.5-flash';
let scanDraft=null;
const fileB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('ファイルを読めませんでした'));r.readAsDataURL(f);});
const scanPrompt=()=>`あなたはサッカー指導の資料を整理する助手です。添付の写真・PDFにある練習メニューを読みとり、次の形のJSONだけを返してください。
{"sourceTitle":"資料の名前（わかれば）","menus":[{"name":"メニュー名","cats":["wup"],"themes":["テーマ"],"ages":["U-12"],"minP":null,"maxP":null,"gk":false,"minutes":null,"size":"大きさ","equip":["用具"],"method":["方法・ルールを1項目ずつ"],"keys":["キーファクター"],"steps":["トレーニングの積み上げ（段階）"],"notes":["留意点・コーチングポイント"],"gkPoints":["GKポイント"]}]}
きまり：
- メニューが複数あれば、1つずつ別の要素にする。発展形（OP・オプション）も別の要素にする。
- cats は wup（W-up・ウォーミングアップ）、tr1（Tr.1・トレーニング1）、tr2（Tr.2・トレーニング2）、game（Game・ゲーム）のどれか。書かれていなければ内容から1つ選ぶ。
- themes は次の一覧から合うものを選ぶ。合うものがなければ資料の言葉を短く入れる：${S.themes.map(t=>t.name).join('、')}
- ages は ${AGES.join('、')} から選ぶ。書かれていなければ空の配列。
- 文章は丸写しにせず、意味を変えずに短く言いかえる。
- 資料に書かれていない項目は、空の配列・空文字・null にする。数字を作らない。人数は「3対3＋3サーバー」のように読みとれる場合だけ数える。`;
async function scanFiles(files){
  const parts=[{text:scanPrompt()}];let img=null;
  for(const f of files){
    if(f.type==='application/pdf'){if(f.size>15e6)throw new Error('PDFが大きすぎます（15MBまで）');parts.push({inline_data:{mime_type:'application/pdf',data:await fileB64(f)}});}
    else if(f.type.startsWith('image/')){parts.push({inline_data:{mime_type:'image/jpeg',data:(await shrink(f,2000)).split(',')[1]}});if(!img)img=await shrink(f);}
    else throw new Error('写真かPDFをえらんでください');
  }
  const model=localStorage.getItem(LSM)||GEMINI_MODEL;
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':localStorage.getItem(LSK)},
    body:JSON.stringify({contents:[{parts}],generationConfig:{response_mime_type:'application/json',temperature:0.2}})});
  const j=await res.json().catch(()=>({}));
  if(!res.ok||j.error)throw new Error((j.error&&j.error.message)||`通信エラー（${res.status}）`);
  const txt=((((j.candidates||[])[0]||{}).content||{}).parts||[]).map(p=>p.text||'').join('');
  let d;try{d=JSON.parse(txt.replace(/^\s*```(?:json)?\s*|\s*```\s*$/g,''));}catch{throw new Error('よみとり結果を解釈できませんでした。もう一度ためしてください');}
  const menus=Array.isArray(d)?d:(d&&Array.isArray(d.menus)?d.menus:[]);
  const title=String((d&&d.sourceTitle)||files[0].name||'').slice(0,80);
  // AIの返事からは決まった項目だけを取り出す（id・図・リンクなどは受けとらない）
  const cards=menus.filter(m=>m&&m.name).map(m=>normCard({name:m.name,cats:m.cats,themes:m.themes,ages:m.ages,minP:m.minP,maxP:m.maxP,gk:m.gk,minutes:m.minutes,size:m.size,equip:m.equip,
    method:m.method,keys:m.keys,steps:m.steps,notes:m.notes,gkPoints:m.gkPoints,src:{type:'jfa',title},share:false})).map(c=>(c.cats.length||c.cats.push('tr1'),c));
  return {cards,img};
}
async function runScan(files){
  if(!localStorage.getItem(LSK)){toast('さきに「設定」でGemini APIキーを登録してください');return;}
  $('#modalBox').innerHTML='<div class="empty"><b>よみとっています…</b><br>1分ほどかかることがあります。このままお待ちください。</div>';$('#modal').classList.add('on');
  let r;
  try{r=await scanFiles(files);}catch(err){console.error(err);ACT.closeModal();toast('よみとれませんでした：'+err.message);return;}
  if(!r.cards.length){ACT.closeModal();toast('練習メニューが見つかりませんでした');return;}
  if(r.cards.length===1){ACT.closeModal();edit.draft=r.cards[0];if(r.img)edit.images.push({src:r.img,board:null});render();window.scrollTo(0,0);toast('下書きを入れました。内容を確認して保存してください');return;}
  scanDraft=r.cards;
  $('#modalBox').innerHTML=`<div class="bar"><h3 style="margin:0">${r.cards.length}つのメニューが見つかりました</h3><span class="grow"></span><button class="btn sm" data-act="closeModal">やめる</button></div>
    <p class="meta" style="margin-bottom:8px">登録するものにチェックを入れてください。登録したあと、カードを開いて内容を確認・修正できます。</p>
    ${r.cards.map((c,i)=>`<label class="pickitem"><input type="checkbox" data-scan="${i}" checked style="width:22px;height:22px;flex:none"><span>${badges(c)}<b>${esc(c.name)}</b><br><span class="meta">${esc(cardMeta(c))}</span></span></label>`).join('')}
    <button class="btn pri" data-act="scanSave" style="width:100%;margin-top:8px">えらんだメニューを登録する</button>`;

/* ========== 作図ボード ========== */
// 図は {field, items} の形で持ち、表示・印刷のときにSVGにする。座標は 1000×700 の中。
const BW=1000,BH=700;
const FIELDS=[['goal','ゴール前'],['half','ハーフコート'],['full','フルコート'],['grid','グリッド'],['blank','コートなし']];
const TOOLS=[['select','えらぶ'],['p:w','白'],['p:b','黒'],['p:S','サーバー'],['p:G','GK'],['p:F','フリー'],['p:C','コーチ'],
  ['ball','ボール'],['cone','コーン'],['marker','マーカー'],['goal','ゴール'],['mini','ミニゴール'],
  ['l:pass','パス'],['l:run','人の動き'],['l:drib','ドリブル'],['l:line','線'],['r','わく'],['t','文字']];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const n1=v=>Math.round(v*10)/10;
function normBoard(b){
  const N=v=>{const n=Number(v);return Number.isFinite(n)?clamp(n,-200,1200):0;};
  const items=(Array.isArray(b.items)?b.items:[]).slice(0,300).map(it=>{
    if(!it)return null;
    switch(it.t){
      case 'p':return ['w','b','S','G','F','C'].includes(it.k)?{t:'p',k:it.k,x:N(it.x),y:N(it.y),rot:((Math.round(N(it.rot))%360)+360)%360}:null;
      case 'ball':case 'cone':case 'marker':return {t:it.t,x:N(it.x),y:N(it.y)};
      case 'goal':case 'mini':return {t:it.t,x:N(it.x),y:N(it.y),rot:(Math.round(N(it.rot)/90)*90)%360};
      case 'l':{if(!['pass','run','drib','line'].includes(it.k))return null;
        const o={t:'l',k:it.k,x1:N(it.x1),y1:N(it.y1),x2:N(it.x2),y2:N(it.y2)};if(it.cx!=null){o.cx=N(it.cx);o.cy=N(it.cy);}return o;}
      case 'r':return {t:'r',x:N(it.x),y:N(it.y),w:N(it.w),h:N(it.h)};
      case 't':return {t:'t',x:N(it.x),y:N(it.y),s:String(it.s||'').slice(0,40)};
      default:return null;
    }}).filter(Boolean);
  return {field:FIELDS.some(f=>f[0]===b.field)?b.field:'blank',frot:[90,180,270].includes(+b.frot)?+b.frot:0,items};
}
// コートの向き（frot）：90度・270度は横長の枠におさまるよう縮めて回す
const fieldWrap=(f,r)=>!r?fieldSVG(f):`<g transform="translate(500 350) rotate(${r})${r===180?'':' scale(0.68)'} translate(-500 -350)">${fieldSVG(f)}</g>`;
// はじめに選ぶコートの一覧（コートの種類と向き）
const FIELD_PICKS=[['half',0,'ハーフコート（ゴールが上）'],['half',90,'ハーフコート（ゴールが右）'],['half',180,'ハーフコート（ゴールが下）'],['half',270,'ハーフコート（ゴールが左）'],
  ['full',0,'フルコート（横）'],['full',90,'フルコート（縦）'],['goal',0,'ゴール前（上）'],['goal',180,'ゴール前（下）'],['grid',0,'グリッド'],['blank',0,'コートなし']];
function goalSVG(cx,cy,rot,w,d){
  let net=`<path d="M${-w/2} 0H${w/2}"/>`;
  for(let i=1;i<8;i++)net+=`<path d="M${n1(-w/2+w*i/8)} ${-d/2}V${d/2}"/>`;
  return `<g transform="translate(${n1(cx)} ${n1(cy)}) rotate(${rot||0})"><rect x="${-w/2}" y="${-d/2}" width="${w}" height="${d}" fill="#eee" stroke="#222" stroke-width="3"/><g stroke="#999" stroke-width="1.5">${net}</g></g>`;
}
function fieldSVG(f){
  const L='fill="none" stroke="#222" stroke-width="3"';
  if(f==='grid')return `<rect x="100" y="80" width="800" height="540" ${L}/>`;
  if(f==='goal')return `<path d="M60 90H940" ${L}/><rect x="150" y="90" width="700" height="290" ${L}/><rect x="340" y="90" width="320" height="95" ${L}/>`+goalSVG(500,68,0,130,44);
  if(f==='half')return `<rect x="40" y="70" width="920" height="590" ${L}/><rect x="227" y="70" width="546" height="185" ${L}/><rect x="376" y="70" width="248" height="62" ${L}/><path d="M417 255A103 103 0 0 0 583 255M397 660A103 103 0 0 1 603 660" ${L}/><circle cx="500" cy="194" r="4" fill="#222"/>`+goalSVG(500,49,0,100,42);
  if(f==='full')return `<rect x="50" y="60" width="900" height="580" ${L}/><path d="M500 60V640" ${L}/><circle cx="500" cy="350" r="78" ${L}/><rect x="50" y="178" width="141" height="344" ${L}/><rect x="50" y="272" width="47" height="156" ${L}/><rect x="809" y="178" width="141" height="344" ${L}/><rect x="903" y="272" width="47" height="156" ${L}/>`+goalSVG(37,350,90,64,26)+goalSVG(963,350,90,64,26);
  return '';
}
// 線：パス＝実線の矢印、人の動き＝点線の矢印、ドリブル＝波線の矢印、線＝矢印なし
const lineMid=it=>it.cx!=null?{x:.25*it.x1+.5*it.cx+.25*it.x2,y:.25*it.y1+.5*it.cy+.25*it.y2}:{x:(it.x1+it.x2)/2,y:(it.y1+it.y2)/2};
function lineSVG(it,hit){
  const curved=it.cx!=null, arrow=it.k!=='line';
  const q=t=>curved?{x:(1-t)*(1-t)*it.x1+2*t*(1-t)*it.cx+t*t*it.x2,y:(1-t)*(1-t)*it.y1+2*t*(1-t)*it.cy+t*t*it.y2}:{x:it.x1+(it.x2-it.x1)*t,y:it.y1+(it.y2-it.y1)*t};
  const rough=curved?Math.hypot(it.cx-it.x1,it.cy-it.y1)+Math.hypot(it.x2-it.cx,it.y2-it.cy):Math.hypot(it.x2-it.x1,it.y2-it.y1);
  const N=it.k==='drib'?clamp(Math.round(rough/4),12,200):curved?28:1;
  const pts=[],len=[0];
  for(let i=0;i<=N;i++){pts.push(q(i/N));if(i)len.push(len[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));}
  const total=len[N], cut=arrow?Math.max(0,total-14):total;
  let ex=curved?it.x2-it.cx:it.x2-it.x1, ey=curved?it.y2-it.cy:it.y2-it.y1;
  const el=Math.hypot(ex,ey)||1;ex/=el;ey/=el;
  let d='';
  for(let i=0;i<=N;i++){
    if(len[i]>cut)break;
    let {x,y}=pts[i];
    if(it.k==='drib'){const a=pts[Math.min(N,i+1)],b=pts[Math.max(0,i-1)],tx=a.x-b.x,ty=a.y-b.y,tl=Math.hypot(tx,ty)||1;
      const o=9*Math.sin(len[i]/9)*Math.max(0,Math.min(1,len[i]/20,(cut-len[i])/20));x-=ty/tl*o;y+=tx/tl*o;}
    d+=(d?'L':'M')+n1(x)+' '+n1(y);
  }
  if(arrow)d+=`L${n1(it.x2-ex*14)} ${n1(it.y2-ey*14)}`;
  const bx=it.x2-ex*22,by=it.y2-ey*22;
  return (hit?`<path d="${d}L${n1(it.x2)} ${n1(it.y2)}" fill="none" stroke="#000" stroke-opacity="0" stroke-width="34"/>`:'')
    +`<path d="${d}" fill="none" stroke="#222" stroke-width="${arrow?3.5:3}" stroke-linejoin="round"${it.k==='run'?' stroke-dasharray="12 9"':''}/>`
    +(arrow?`<polygon points="${n1(it.x2)},${n1(it.y2)} ${n1(bx-ey*9)},${n1(by+ex*9)} ${n1(bx+ey*9)},${n1(by-ex*9)}" fill="#222"/>`:'');
}
function itemSVG(it,i,editing){
  const x=n1(it.x),y=n1(it.y);let s='';
  if(it.t==='p'){const fill={w:'#fff',b:'#222',S:'#bdbdbd',G:'#ffe066',F:'#fff',C:'#cfe3ff'}[it.k];
    // 両手を体の前に出して描く。手のある側が、選手の向いている方向（rot：0=上、90=右、180=下、270=左）
    s=`<g transform="translate(${x} ${y}) rotate(${it.rot||0})"><path d="M-14 -9L-23 -17M14 -9L23 -17" stroke="#222" stroke-width="3" stroke-linecap="round"/><circle cx="-24" cy="-18" r="4.5" fill="#222"/><circle cx="24" cy="-18" r="4.5" fill="#222"/></g>`
      +`<circle cx="${x}" cy="${y}" r="17" fill="${fill}" stroke="#222" stroke-width="3"/>`+(it.k==='F'?`<circle cx="${x}" cy="${y}" r="23" fill="none" stroke="#222" stroke-width="2"/>`:'')
      +('SGFC'.includes(it.k)?`<text x="${x}" y="${y}" font-size="20" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">${it.k}</text>`:'');}
  else if(it.t==='ball')s=`<circle cx="${x}" cy="${y}" r="9" fill="#fff" stroke="#222" stroke-width="3"/><circle cx="${x}" cy="${y}" r="3" fill="#222"/>`;
  else if(it.t==='cone')s=`<polygon points="${x},${n1(it.y-17)} ${n1(it.x-14)},${n1(it.y+12)} ${n1(it.x+14)},${n1(it.y+12)}" fill="#e53935" stroke="#8e1b18" stroke-width="2" stroke-linejoin="round"/>`;
  else if(it.t==='marker')s=`<ellipse cx="${x}" cy="${y}" rx="15" ry="8" fill="#fdd835" stroke="#8a6d00" stroke-width="2"/>`;
  else if(it.t==='goal')s=goalSVG(it.x,it.y,it.rot,130,44);
  else if(it.t==='mini')s=goalSVG(it.x,it.y,it.rot,70,26);
  else if(it.t==='l')s=lineSVG(it,editing);
  else if(it.t==='r')s=`<rect x="${n1(Math.min(it.x,it.x+it.w))}" y="${n1(Math.min(it.y,it.y+it.h))}" width="${n1(Math.abs(it.w))}" height="${n1(Math.abs(it.h))}" fill="#000" fill-opacity="0.04" stroke="#555" stroke-width="2.5" stroke-dasharray="10 8"/>`;
  else if(it.t==='t')s=`<text x="${x}" y="${y}" font-size="30" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#222">${esc(it.s)}</text>`;
  return `<g${editing?` data-i="${i}"`:''}>${s}</g>`;
}
const boardInner=(b,editing)=>`<rect width="${BW}" height="${BH}" fill="#fff"/>`+fieldWrap(b.field,b.frot)+b.items.map((it,i)=>itemSVG(it,i,editing)).join('');
const svgURL=b=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${BW} ${BH}" font-family="sans-serif">${boardInner(b,false)}</svg>`);

let B=null; // 作図中の状態
function toolIcon(id){
  if(id==='select')return '<svg viewBox="0 0 24 24"><path d="M6 3l12 9-5.5 1 3 6-2.2 1-3-6L6 18z" fill="#222"/></svg>';
  if(id==='r')return '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="4 3"/></svg>';
  if(id==='t')return '<svg viewBox="0 0 24 24"><text x="12" y="19" font-size="18" font-weight="700" text-anchor="middle" fill="#222">あ</text></svg>';
  if(id.startsWith('l:'))return `<svg viewBox="0 0 110 110">${itemSVG({t:'l',k:id.slice(2),x1:10,y1:92,x2:100,y2:20},0,false)}</svg>`;
  const it=id.startsWith('p:')?{t:'p',k:id.slice(2),x:0,y:0}:{t:id,x:0,y:0,rot:0};
  return `<svg viewBox="${id==='goal'?'-75 -75 150 150':id==='mini'?'-45 -45 90 90':'-27 -27 54 54'}">${itemSVG(it,0,false)}</svg>`;
}
function openBoard(idx){
  const src=idx!=null?edit.images[idx].board:null;
  B={idx,board:src?JSON.parse(JSON.stringify(src)):{field:'half',frot:0,items:[]},tool:'p:w',sel:null,undo:[],drag:null,rot:{},pick:!src};
  $('#board').classList.add('on');document.body.style.overflow='hidden';drawBoardUI();
}
function closeBoard(){B=null;$('#board').classList.remove('on');document.body.style.overflow='';}
function drawBoardUI(){
  const fname=(FIELDS.find(f=>f[0]===B.board.field)||[])[1]||'';
  $('#btools').innerHTML=`<button class="tool" data-act="bPick" style="min-width:96px"><b style="font-size:12px">コートをえらぶ</b>${esc(fname)}</button>`
    +(B.board.field==='blank'||B.board.field==='grid'?'':`<button class="tool" data-act="bFRot"><svg viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="2.2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>コートの向き</button>`)
    +TOOLS.map(([id,l])=>`<button class="tool${B.tool===id?' on':''}" data-act="bTool" data-tool="${id}">${toolIcon(id)}${l}</button>`).join('');
  const pk=$('#bpick');pk.classList.toggle('on',!!B.pick);
  pk.innerHTML=B.pick?`<h3>コートをえらんでください</h3><div class="pickgrid">${FIELD_PICKS.map(([f,r,l])=>`<button class="picktile" data-act="bField" data-f="${f}" data-r="${r}"><svg viewBox="0 0 ${BW} ${BH}"><rect width="${BW}" height="${BH}" fill="#fff"/>${fieldWrap(f,r)}</svg>${l}</button>`).join('')}</div><p class="hint">あとからでも「コートをえらぶ」「コートの向き」で変えられます。</p>`:'';
  drawBoard();
}
function drawBoard(){
  const b=B.board,it=b.items[B.sel];
  const H=(k,x,y)=>`<circle data-h="${k}" cx="${n1(x)}" cy="${n1(y)}" r="22" fill="#1565C0" fill-opacity=".25" stroke="#1565C0" stroke-width="2.5"/>`;
  let h=boardInner(b,true);
  if(it){
    if(it.t==='l'){const m=lineMid(it);h+=H('p1',it.x1,it.y1)+H('p2',it.x2,it.y2)+H('c',m.x,m.y);}
    else if(it.t==='r')h+=H('rs',it.x+it.w,it.y+it.h);
    else if(it.t==='p'){const a=(it.rot||0)*Math.PI/180,hx=it.x+Math.sin(a)*62,hy=it.y-Math.cos(a)*62;
      h+=`<circle cx="${n1(it.x)}" cy="${n1(it.y)}" r="34" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="7 6" pointer-events="none"/><path d="M${n1(it.x)} ${n1(it.y)}L${n1(hx)} ${n1(hy)}" stroke="#1565C0" stroke-width="2" stroke-dasharray="4 4" pointer-events="none"/>`+H('rot',hx,hy);}
    else h+=`<circle cx="${n1(it.x)}" cy="${n1(it.y)}" r="${it.t==='goal'?78:it.t==='t'?44:32}" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="7 6" pointer-events="none"/>`;
  }
  $('#bsvg').innerHTML=h;
  const hint=B.tool==='select'?'動かしたいものをタップして、そのまま指で動かします。':B.tool.startsWith('l:')?'図の上をなぞって線を引きます。引いたあと、まんなかの丸を動かすと曲げられます。':B.tool==='r'?'図の上をなぞって、わくを作ります。':B.tool==='t'?'文字を置きたい場所をタップします。':B.tool.startsWith('p:')?'タップして置きます。置いたまま指をずらすと、その方向に体が向きます（手のある側が前）。':'図の上をタップして置きます。動かすときは「えらぶ」に切りかえます。';
  $('#bsel').innerHTML=it?`<button class="btn sm danger" data-act="bDel">これを消す</button>`
      +(it.t==='goal'||it.t==='mini'?'<button class="btn sm" data-act="bRot">向きをかえる</button>':'')
      +(it.t==='t'?'<button class="btn sm" data-act="bText">文字をかえる</button>':'')
      +(it.t==='l'&&it.cx!=null?'<button class="btn sm" data-act="bStraight">まっすぐにする</button>':'')
      +(it.t==='l'?'<span>丸を動かして、長さ・向き・曲がりをかえられます。</span>':'')
      +(it.t==='p'?'<span>青い丸を動かすと、体の向きをかえられます（手のある側が前）。</span>':'')
    :`<span style="flex:1">${hint}</span>${b.items.length?'<button class="btn sm" data-act="bClear">ぜんぶ消す</button>':''}`;
}
const bSnap=()=>{B.undo.push(JSON.stringify(B.board));if(B.undo.length>60)B.undo.shift();};
function bPoint(e){const p=new DOMPoint(e.clientX,e.clientY).matrixTransform($('#bsvg').getScreenCTM().inverse());return {x:clamp(Math.round(p.x),0,BW),y:clamp(Math.round(p.y),0,BH)};}
function bDown(e){
  if(!B)return;e.preventDefault();
  const p=bPoint(e),items=B.board.items,tool=B.tool,h=e.target.closest('[data-h]');
  if(h)B.drag={type:'h',h:h.dataset.h,snapped:false};
  else if(tool==='select'){const g=e.target.closest('[data-i]');B.sel=g?+g.dataset.i:null;B.drag=g?{type:'move',last:p,snapped:false}:null;drawBoard();}
  else if(tool==='t'){const s=prompt('入れる文字（例：12m）');if(s&&s.trim()){bSnap();items.push({t:'t',x:p.x,y:p.y,s:s.trim().slice(0,40)});B.sel=null;drawBoard();}return;}
  else if(tool.startsWith('l:')){bSnap();items.push({t:'l',k:tool.slice(2),x1:p.x,y1:p.y,x2:p.x,y2:p.y});B.sel=items.length-1;B.drag={type:'h',h:'p2',snapped:true,fresh:true};}
  else if(tool==='r'){bSnap();items.push({t:'r',x:p.x,y:p.y,w:0,h:0});B.sel=items.length-1;B.drag={type:'h',h:'rs',snapped:true,fresh:true};}
  else if(tool.startsWith('p:')){bSnap();const k=tool.slice(2);items.push({t:'p',k,x:p.x,y:p.y,rot:B.rot[k]||0});B.sel=items.length-1;B.drag={type:'h',h:'rot',snapped:true,place:true};drawBoard();}
  else{bSnap();const it={t:tool,x:p.x,y:p.y};if(tool==='goal'||tool==='mini')it.rot=0;items.push(it);B.sel=null;drawBoard();return;}
  if(B.drag)$('#bsvg').setPointerCapture(e.pointerId);
}
function bMove(e){
  if(!B||!B.drag)return;
  const p=bPoint(e),it=B.board.items[B.sel],d=B.drag;if(!it)return;
  if(!d.snapped){bSnap();d.snapped=true;}
  if(d.type==='move'){const dx=p.x-d.last.x,dy=p.y-d.last.y;d.last=p;
    if(it.t==='l'){it.x1+=dx;it.x2+=dx;it.y1+=dy;it.y2+=dy;if(it.cx!=null){it.cx+=dx;it.cy+=dy;}}else{it.x+=dx;it.y+=dy;}}
  else if(d.h==='p1'){it.x1=p.x;it.y1=p.y;}
  else if(d.h==='p2'){it.x2=p.x;it.y2=p.y;}
  else if(d.h==='c'){it.cx=2*p.x-(it.x1+it.x2)/2;it.cy=2*p.y-(it.y1+it.y2)/2;}
  else if(d.h==='rs'){it.w=p.x-it.x;it.h=p.y-it.y;}
  else if(d.h==='rot'){const dx=p.x-it.x,dy=p.y-it.y;if(Math.hypot(dx,dy)<22)return;it.rot=((Math.round(Math.atan2(dx,-dy)*180/Math.PI/15)*15)+360)%360;B.rot[it.k]=it.rot;}
  drawBoard();
}
function bUp(){
  if(!B||!B.drag)return;
  const d=B.drag,it=B.board.items[B.sel];B.drag=null;
  if(it&&it.t==='r'){if(it.w<0){it.x+=it.w;it.w=-it.w;}if(it.h<0){it.y+=it.h;it.h=-it.h;}}
  if(d.place)B.sel=null;
  if(d.fresh&&it&&(it.t==='l'?Math.hypot(it.x2-it.x1,it.y2-it.y1)<18:(it.w<18||it.h<18))){B.board.items.pop();B.undo.pop();B.sel=null;}
  drawBoard();
}

function slotLabel(p,s){const same=p.slots.filter(x=>x.cat===s.cat);return catLabel(s.cat)+(same.length>1?` ${same.indexOf(s)+1}`:'');}
function totalHTML(p){

  return `<p class="total${d<0?' over':''}" id="total">合計 ${sum}分 / 予定 ${p.totalMin}分（${d===0?'ぴったり':d>0?`あと${d}分`:`${-d}分オーバー`}）</p>`;
}

    ${s.memo?`<p class="meta">メモ：${esc(s.memo)}</p>`:''}</div>`;}).join('')}

const curPlan=()=>plan(view().id);
const slotOf=el=>{const p=curPlan(),sid=el.closest('[data-sid]').dataset.sid;return p.slots.find(s=>s.id===sid);};
function candidates(p,s,o){
  return S.cards.filter(c=>c.cats.includes(s.cat)
    &&(!o.theme||!p.theme||c.themes.includes(p.theme))
    &&(!o.age||!p.age||!c.ages.length||c.ages.includes(p.age))
    &&(!o.players||matchPlayers(c,p.players)));
}
// おまかせの点数：お気に入りと、できばえの良かったカードを優先。直近2週間に使ったカードは後回し。
function pickScore(c,p,st){
  const o=st.get(c.id);let sc=Math.random()*1.5+(c.fav?2:0);
  if(!o)return sc+.5;
  if(o.rn)sc+=(o.sum/o.rn-2)*1.5;
  const d=(Date.parse(p.date)-Date.parse(o.last))/864e5;
  if(d>=0&&d<14)sc-=2;
  return sc;
}
function nextCandidate(p,s){
  const others=new Set(p.slots.filter(x=>x!==s).map(x=>x.cardId));
  let c=candidates(p,s,{theme:1,age:1,players:1}).filter(x=>!others.has(x.id));
  if(c.length<2)c=candidates(p,s,{theme:1}).filter(x=>!others.has(x.id));
  c.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  if(!c.length||(c.length===1&&c[0].id===s.cardId))return null;
  return c[(c.findIndex(x=>x.id===s.cardId)+1)%c.length];
}
function spreadTime(p){
  if(p.totalMin==null){toast('さきに「総時間（分）」を入れてください');return;}
  if(!p.slots.length)return;
  if(p.slots.some(s=>s.minutes!=null)&&!confirm('いま入っている時間を、ふり分けなおしますか？'))return;
  const W={wup:3,tr1:5,tr2:5,game:7},sum=p.slots.reduce((a,s)=>a+W[s.cat],0);
  let rest=p.totalMin;
  p.slots.forEach((s,i)=>{const m=i===p.slots.length-1?rest:Math.min(rest,Math.round(p.totalMin*W[s.cat]/sum/5)*5);s.minutes=Math.max(0,m);rest-=s.minutes;});
  savePlan(p);render();toast('時間をふり分けました');
}
function autoFill(p){
  let targets=p.slots.filter(s=>!card(s.cardId));
  if(!targets.length){if(!confirm('すべての枠を入れなおしますか？'))return;targets=p.slots;}
  const used=new Set(p.slots.filter(s=>!targets.includes(s)).map(s=>s.cardId)),st=cardStats();
  let ok=0;
  for(const s of targets){
    let c=candidates(p,s,{theme:1,age:1,players:1}).filter(x=>!used.has(x.id));
    if(!c.length)c=candidates(p,s,{theme:1}).filter(x=>!used.has(x.id));
    if(!c.length){s.cardId=null;continue;}
    const pickd=c.map(x=>[pickScore(x,p,st),x]).sort((a,b)=>b[0]-a[0])[0][1];
    s.cardId=pickd.id;s.rating=0;s.result='';used.add(pickd.id);ok++;
  }
  savePlan(p);render();

function printPlan(p,mode){
  const info=[p.template||p.draftTpl?'':p.date,p.theme?`テーマ：${p.theme}`:'',p.age?`対象：${p.age}`:'',p.players!=null?`${p.players}人`:'',`合計 ${p.slots.reduce((a,s)=>a+(slotMin(s)||0),0)}分`].filter(Boolean).join('　');
  const rows=p.slots.map(s=>{const c=card(s.cardId),m=slotMin(s);return `<tr><td style="white-space:nowrap"><b>${esc(slotLabel(p,s))}</b></td><td style="white-space:nowrap">${m!=null?m+'分':''}</td>
    <td>${c?`<b>${esc(c.name)}</b>${c.images[0]?`<img src="${c.images[0].src}" alt="">`:''}`:''}</td>
    <td>${c?`${esc([c.size,c.equip.join('、')].filter(Boolean).join(' ／ '))}${mode==='list'?ul(c.method):''}`:''}</td>
    <td>${c?ul(c.keys):''}${s.memo?`<div>メモ：${esc(s.memo)}</div>`:''}</td></tr>`;}).join('');
  let h=`<div class="p-head"><h1>${esc(planTitle(p))}</h1><p>${esc(info)}</p></div>
    <table class="p-table"><thead><tr><th>区分</th><th>時間</th><th>メニュー</th><th>オーガナイズ</th><th>キーファクター・メモ</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="p-memo">ふりかえり<div class="pre">${esc(p.review)}</div></div>`;
  if(mode==='detail')h+=p.slots.map(s=>card(s.cardId)).filter(Boolean).map(c=>`<div class="p-page">${sheetHTML(c)}</div>`).join('');
  $('#print').innerHTML=h;
  setTimeout(()=>window.print(),150);
}

function exportData(){
  const blob=new Blob([JSON.stringify({app:'renshu-base',version:1,exported:new Date().toISOString(),themes:S.themes,cards:S.cards,plans:S.plans})],{type:'application/json'});
  const name=`renshu-base-${today()}.json`, file=new File([blob],name,{type:'application/json'});
  if(isIOS&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>{});return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);

async function importData(text){
  let d;try{d=JSON.parse(text);}catch{toast('ファイルを読めませんでした（JSONではありません）');return;}
  const cards=Array.isArray(d)?d:(Array.isArray(d.cards)?d.cards:[]), plans=Array.isArray(d.plans)?d.plans:[];
  if(!cards.length&&!plans.length){toast('カードも計画も入っていませんでした');return;}
  for(const t of (Array.isArray(d.themes)?d.themes:[])){if(t&&t.name&&!S.themes.some(x=>x.name===t.name))S.themes.push({group:String(t.group||'じぶんのテーマ'),name:String(t.name)});}
  for(const raw of cards){const c=normCard(raw);for(const t of c.themes){if(!S.themes.some(x=>x.name===t))S.themes.push({group:'じぶんのテーマ',name:t});}
    const i=S.cards.findIndex(x=>x.id===c.id);if(i>=0)S.cards[i]=c;else S.cards.push(c);await dbPut('cards',c);}
  for(const raw of plans){const p=normPlan(raw);const i=S.plans.findIndex(x=>x.id===p.id);if(i>=0)S.plans[i]=p;else S.plans.push(p);await dbPut('plans',p);}
  await saveThemes();render();toast(`カード${cards.length}枚・計画${plans.length}件を読みこみました`);
}

    }
    if(get('seeded')&&!get('tplfix'))await restoreSeedPlans();
    for(const k of ['tplfix','seedfig','seedfig2','pack2','pack3','pack4','pack5','pack6','pack7','pack8','pack9','pack10','pack11']){if(!get(k))await dbPut('meta',{key:k,value:1});}
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(err){console.error(err);$('#main').innerHTML='<div class="empty">データの保存場所をひらけませんでした。プライベートブラウズを切って、もう一度ひらいてください。</div>';return;}
  render();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
