<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>練習ベース</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1B6B3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="練習ベース">
<style>
:root{
  --green:#1B6B3A; --green-d:#134E2A; --green-l:#E7F2EA; --ink:#1C2420; --sub:#5C6A62;
  --line:#D5DDD7; --bg:#F4F7F4; --card:#fff; --warn:#B4541A; --danger:#B3261E;
  --wup:#C77700; --tr1:#1565C0; --tr2:#6A3FB5; --game:#1B6B3A;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:var(--green);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.04em}
header.top small{opacity:.8;font-size:12px}
main{max-width:1100px;margin:0 auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 96px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 8px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--green);font-weight:700}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;min-height:44px;font-size:15px}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.btn.danger{color:var(--danger);border-color:#E7C2BF}
.btn.sm{min-height:36px;padding:5px 10px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--green);font-weight:700;padding-left:4px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:15;background:var(--green);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:92px;resize:vertical}
label.f{display:block;margin-bottom:12px}
label.f>span,.flabel{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}
.hint{font-size:12px;color:var(--sub);font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:18px;padding:6px 12px;font-size:14px;min-height:36px}
.chip input:checked+span{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.chip input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:16px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.count{font-size:13px;color:var(--sub);margin:6px 2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;overflow:hidden;padding:0;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/10;background:var(--green-l);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.thumb svg{width:58%;opacity:.55}
.cbody{padding:10px 12px 12px}
.cbody h3{margin:4px 0 2px;font-size:16px;line-height:1.4}
.meta{font-size:12.5px;color:var(--sub);margin:0}
.badge{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:1px 8px;margin-right:4px;background:var(--sub)}
.cat-wup{background:var(--wup)}.cat-tr1{background:var(--tr1)}.cat-tr2{background:var(--tr2)}.cat-game{background:var(--game)}
.star{color:#D99A00}
.empty{text-align:center;color:var(--sub);padding:36px 12px}
/* カード詳細（JFA資料と同じ並び） */
.sheet{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sheet-head{display:flex;align-items:stretch;border-bottom:3px solid #111}
.sheet-head .tema-l{background:#111;color:#fff;font-weight:700;padding:8px 14px;white-space:nowrap}
.sheet-head .tema{font-weight:800;font-size:19px;padding:6px 14px;flex:1}
.sheet-head .srcline{font-size:12px;color:var(--sub);padding:10px 12px;text-align:right}
.sheet-body{padding:14px}
.sheet h2{margin:0 0 12px;font-size:22px;line-height:1.35}
.sheet h2 .catbig{font-size:26px;font-weight:900;margin-right:10px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.cols{grid-template-columns:1fr}}
.figs img{width:100%;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff;display:block}
.nofig{border:1px dashed var(--line);border-radius:8px;padding:28px 10px;text-align:center;color:var(--sub);font-size:14px}
.sheet h4{margin:0 0 4px;font-size:15px}
.sheet dl{margin:0 0 12px}
.sheet dt{font-weight:700;font-size:14px;margin-top:4px}
.sheet dd{margin:0 0 2px 1em}
.pre{white-space:pre-wrap}
.keybox{border:1.5px solid #111;margin:14px 0 12px;padding:14px 12px 8px;position:relative}
.keybox h4{position:absolute;top:-13px;left:-1.5px;background:#111;color:#fff;padding:1px 12px;font-size:14px}
.keybox ul{margin:0;padding-left:1.2em}
.notebox{border:1px dashed #555;margin:16px 0 12px;padding:14px 12px 8px;position:relative}
.notebox h4{position:absolute;top:-13px;left:8px;background:#E3E6E4;padding:1px 12px;font-size:14px}
.notebox.gk h4{background:#BFE0E6}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--sub);margin-top:10px}
.oplist a{display:inline-block;margin:2px 8px 2px 0}
a{color:var(--green)}
/* 計画 */
.planrow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.planrow b{display:block}
.total{font-weight:700;margin:4px 0 12px}
.total.over{color:var(--warn)}
.slot{background:#fff;border:1px solid var(--line);border-left:6px solid var(--sub);border-radius:12px;padding:12px;margin-bottom:10px}
.slot.s-wup{border-left-color:var(--wup)}.slot.s-tr1{border-left-color:var(--tr1)}.slot.s-tr2{border-left-color:var(--tr2)}.slot.s-game{border-left-color:var(--game)}
.slot-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.slot-h .name{font-weight:800;font-size:17px}
.slot-card{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.slot-card img{width:96px;height:64px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff}
.slot-card .t{font-weight:700;font-size:16px;border:0;background:none;padding:0;text-align:left;color:var(--green);text-decoration:underline}
.pickbtn{width:100%;border:2px dashed var(--line);background:var(--bg);border-radius:10px;padding:16px;color:var(--sub);font-weight:700;margin-bottom:8px}
.slot-f{display:grid;grid-template-columns:110px 1fr;gap:8px}
.slot-card{flex-wrap:wrap}
.slot-card>.grow{min-width:180px}
.rate{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.rate input{flex:1;min-width:180px}
.iconbtn{border:1px solid var(--line);background:#fff;border-radius:8px;width:36px;height:36px;padding:0}
/* モーダル */
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{background:#fff;width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
@media(min-width:760px){#modal{align-items:center}#modal .box{border-radius:18px}}
.pickitem{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px;margin-bottom:6px}
.pickitem img,.pickitem .ph{width:84px;height:56px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:var(--green-l);flex:none}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translateX(-50%);background:#222;color:#fff;border-radius:22px;padding:10px 18px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
#a2hs{background:#FFF4D6;border:1px solid #E5C76B;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;display:none}
.imgstrip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.imgstrip .it{position:relative}
.imgstrip img{height:92px;border:1px solid var(--line);border-radius:8px;display:block;background:#fff}
.imgstrip .x{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:14px;border:0;background:#222;color:#fff;padding:0}
.imgstrip .re{position:absolute;left:4px;bottom:4px;border:0;border-radius:8px;background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:4px 8px}
/* 作図ボード */
#board{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column}
#board.on{display:flex}
.b-top{background:var(--green);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
.b-top b{flex:1;text-align:center}
.b-top .btn{color:var(--ink)}
.b-tools{display:flex;flex-wrap:wrap;gap:6px;padding:8px;align-items:stretch}
@media(max-width:640px){.b-tools{flex-wrap:nowrap;overflow-x:auto}}
.b-tools select{width:auto;min-height:52px;flex:none}
.tool{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;min-width:60px;padding:4px 6px 3px;font-size:11px;line-height:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tool svg{width:30px;height:30px;pointer-events:none}
.tool.on{border-color:var(--green);background:var(--green-l);box-shadow:inset 0 0 0 1.5px var(--green);font-weight:700}
.b-canvas{flex:1;min-height:0;padding:0 8px}
#bsvg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.b-sel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:60px;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);font-size:13px;color:var(--sub)}
#print{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:11pt}
  body>*:not(#print){display:none!important}
  #print{display:block}
  .p-head{border-bottom:3px solid #111;margin-bottom:8px;padding-bottom:4px}
  .p-head h1{margin:0;font-size:18pt}
  .p-head p{margin:2px 0 0;font-size:10.5pt}
  table.p-table{width:100%;border-collapse:collapse;font-size:10pt}
  .p-table th,.p-table td{border:1px solid #333;padding:4px 6px;vertical-align:top;text-align:left}
  .p-table th{background:#eee}
  .p-table img{max-width:42mm;max-height:30mm;display:block;margin-top:3px}
  .p-table ul{margin:0;padding-left:1.1em}
  .p-memo{border:1px solid #333;min-height:28mm;margin-top:8px;padding:4px 6px;font-size:10pt}
  .p-page{break-before:page}
  .sheet{border:0;border-radius:0}
  .sheet-body{padding:8px 0}
  .figs img{max-height:95mm;width:auto;max-width:100%}
  .keybox,.notebox,.slot{break-inside:avoid}
}
</style>
</head>
<body>
<header class="top"><h1>練習ベース</h1><small>サッカー</small></header>
<main id="main"></main>
<nav class="tabs">
  <button data-act="tab" data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="7" height="7" rx="1.5"/><rect x="14" y="4" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>図鑑</button>
  <button data-act="tab" data-tab="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M8 2v4M16 2v4M8 11h8M8 15h8"/></svg>計画</button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>設定</button>
</nav>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<div id="print"></div>
<div id="board">
  <div class="b-top"><button class="btn sm" data-act="bCancel">やめる</button><b>図を描く</b><button class="btn sm" data-act="bUndo">もとに戻す</button><button class="btn sm" data-act="bDone" style="font-weight:700">完了</button></div>
  <div class="b-tools" id="btools"></div>
  <div class="b-canvas"><svg id="bsvg" viewBox="0 0 1000 700"></svg></div>
  <div class="b-sel" id="bsel"></div>
</div>

<script>
'use strict';
/* ========== 定数 ========== */
const CATS=[{id:'wup',label:'W-up'},{id:'tr1',label:'Tr.1'},{id:'tr2',label:'Tr.2'},{id:'game',label:'Game'}];
const AGES=['U-8','U-10','U-12','U-15','U-18','一般'];
const SRC={own:'自作',jfa:'JFAなどの資料',web:'ネット',book:'書籍'};
const EQUIP=['ボール','マーカー','コーン','ビブス','ゴール','ミニゴール'];
const DEFAULT_THEMES=[
  ['攻撃','ゴールを奪う（シュート）'],['攻撃','ボールを運ぶ（ドリブル）'],['攻撃','パス＆コントロール'],['攻撃','ポゼッション'],['攻撃','ビルドアップ'],['攻撃','クロス'],['攻撃','コンビネーション'],
  ['守備','ボールを奪う'],['守備','ゴールを守る'],['守備','1対1の守備'],['守備','チャレンジ＆カバー'],
  ['切り替え','攻→守'],['切り替え','守→攻'],
  ['GK','キャッチング'],['GK','ポジショニング'],['GK','配球'],
  ['からだ','コーディネーション'],['からだ','アジリティ'],['からだ','ボールフィーリング']
].map(([group,name])=>({group,name}));
const PITCH='<svg viewBox="0 0 100 62" fill="none" stroke="#1B6B3A" stroke-width="2"><rect x="2" y="2" width="96" height="58" rx="2"/><path d="M50 2v58"/><circle cx="50" cy="31" r="9"/><rect x="2" y="19" width="12" height="24"/><rect x="86" y="19" width="12" height="24"/></svg>';

/* ========== 小道具 ========== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const num=v=>{const n=parseInt(v,10);return Number.isFinite(n)&&n>=0?n:null;};
const catLabel=id=>(CATS.find(c=>c.id===id)||{}).label||id;
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const safeImg=u=>/^data:image\//.test(u||'');
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600);}

/* ========== 保存（IndexedDB） ========== */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('renshu-base',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('cards',{keyPath:'id'});d.createObjectStore('plans',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'key'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const store=(name,mode)=>db.transaction(name,mode).objectStore(name);
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const dbAll=name=>req(store(name,'readonly').getAll());
const dbPut=(name,o)=>req(store(name,'readwrite').put(o)).catch(e=>{console.error(e);toast('保存に失敗しました。空き容量を確認してください');});
const dbDel=(name,id)=>req(store(name,'readwrite').delete(id));

/* ========== 状態 ========== */
const S={cards:[],plans:[],themes:[]};
const F={q:'',cat:'',theme:'',age:'',players:'',src:'',sort:'',fav:false};
let stack=[{name:'library'}];
let edit=null;   // カード編集中の一時データ {images,opIds}
let picker=null; // カード選択モーダルの状態
const card=id=>S.cards.find(c=>c.id===id);
const plan=id=>S.plans.find(p=>p.id===id);
const view=()=>stack[stack.length-1];
function go(v){stack.push(v);render();window.scrollTo(0,0);}
function back(){if(stack.length>1)stack.pop();render();}

function normCard(o){
  const arr=v=>Array.isArray(v)?v.map(String).filter(Boolean):(v?String(v).split(/[、,]/).map(x=>x.trim()).filter(Boolean):[]);
  const txt=v=>Array.isArray(v)?v.join('\n'):String(v??'');
  const src=o.src&&typeof o.src==='object'?o.src:{};
  return {id:o.id||uid(),sport:o.sport||'soccer',name:String(o.name||'（名前なし）'),
    cats:arr(o.cats).filter(c=>CATS.some(x=>x.id===c)),themes:arr(o.themes),ages:arr(o.ages),
    minP:num(o.minP),maxP:num(o.maxP),gk:!!o.gk,minutes:num(o.minutes),size:String(o.size||''),equip:arr(o.equip),
    method:txt(o.method),keys:txt(o.keys),steps:txt(o.steps),notes:txt(o.notes),gkPoints:txt(o.gkPoints),
    images:(Array.isArray(o.images)?o.images:[]).map(x=>typeof x==='string'?{src:x,board:null}:{src:String(x&&x.src||''),board:x&&x.board?normBoard(x.board):null})
      .map(x=>x.board?{src:svgURL(x.board),board:x.board}:x).filter(x=>safeImg(x.src)),opIds:arr(o.opIds),
    src:{type:SRC[src.type]?src.type:'own',title:String(src.title||''),url:String(src.url||'')},
    memo:txt(o.memo),fav:!!o.fav,share:!!o.share,created:o.created||Date.now(),updated:o.updated||Date.now()};
}
function normPlan(o){
  return {id:o.id||uid(),date:String(o.date||today()),title:String(o.title||''),theme:String(o.theme||''),age:String(o.age||''),
    players:num(o.players),totalMin:num(o.totalMin),
    slots:(Array.isArray(o.slots)?o.slots:[]).map(s=>({id:s.id||uid(),cat:CATS.some(c=>c.id===s.cat)?s.cat:'tr1',cardId:s.cardId||null,minutes:num(s.minutes),memo:String(s.memo||''),rating:[1,2,3].includes(+s.rating)?+s.rating:0,result:String(s.result||'')})),
    review:String(o.review||''),template:!!o.template,done:!!o.done,created:o.created||Date.now(),updated:o.updated||Date.now()};
}
const saveCard=c=>{c.updated=Date.now();return dbPut('cards',c);};
const savePlan=p=>{p.updated=Date.now();return dbPut('plans',p);};
const saveThemes=()=>dbPut('meta',{key:'themes',value:S.themes});
async function ensureThemes(list){let added=false;for(const t of list){if(t&&!S.themes.some(x=>x.name===t)){S.themes.push({group:'じぶんのテーマ',name:t});added=true;}}if(added)await saveThemes();}
// 実施ずみの計画から、カードごとの使用回数・最後に使った日・できばえを集める
const RATE={3:'◎',2:'○',1:'△'};
function cardStats(){
  const m=new Map();
  for(const p of S.plans){if(!p.done||p.template)continue;
    for(const s of p.slots){if(!s.cardId)continue;const o=m.get(s.cardId)||{n:0,last:'',sum:0,rn:0,rows:[]};
      o.n++;if(p.date>o.last)o.last=p.date;if(s.rating){o.sum+=s.rating;o.rn++;}o.rows.push({p,s});m.set(s.cardId,o);}}
  return m;
}
const planTitle=p=>p.title||`${p.date} ${p.theme||'トレーニング'}`;
const slotMin=s=>s.minutes??(card(s.cardId)||{}).minutes??null;

async function putSeed(){
  const sd=seedData();
  for(const c of sd.cards){if(!card(c.id)){S.cards.push(c);await dbPut('cards',c);}}

}

function themeOptions(sel,emptyLabel){
  const groups=[...new Set(S.themes.map(t=>t.group))];
  return `<option value="">${esc(emptyLabel)}</option>`+groups.map(g=>`<optgroup label="${esc(g)}">${S.themes.filter(t=>t.group===g).map(t=>`<option${t.name===sel?' selected':''}>${esc(t.name)}</option>`).join('')}</optgroup>`).join('');
}
const opt=(list,sel,emptyLabel)=>`<option value="">${esc(emptyLabel)}</option>`+list.map(([v,l])=>`<option value="${esc(v)}"${v===sel?' selected':''}>${esc(l)}</option>`).join('');
function matchPlayers(c,n){return n==null||((c.minP==null||c.minP<=n)&&(c.maxP==null||n<=c.maxP));}
function matchCard(c){
  if(F.cat&&!c.cats.includes(F.cat))return false;
  if(F.theme&&!c.themes.includes(F.theme))return false;
  if(F.age&&c.ages.length&&!c.ages.includes(F.age))return false;
  if(F.src&&c.src.type!==F.src)return false;
  if(F.fav&&!c.fav)return false;
  if(!matchPlayers(c,num(F.players)))return false;
  if(F.q){const hay=[c.name,c.themes.join(' '),c.method,c.keys,c.notes,c.memo,c.size,c.src.title].join(' ').toLowerCase();
    if(!F.q.toLowerCase().split(/\s+/).filter(Boolean).every(w=>hay.includes(w)))return false;}
  return true;
}
const badges=c=>c.cats.map(k=>`<span class="badge cat-${k}">${catLabel(k)}</span>`).join('');
function cardMeta(c){
  const p=c.minP!=null||c.maxP!=null?(c.minP===c.maxP?`${c.minP}人`:`${c.minP??''}〜${c.maxP??''}人`):'';
  return [c.themes[0],c.size,p,c.minutes!=null?`${c.minutes}分`:''].filter(Boolean).join(' ・ ');
}

function renderGrid(){
  const g=$('#grid');if(!g)return;
  const st=cardStats(),g0=c=>st.get(c.id)||{n:0,last:'',sum:0,rn:0},avg=c=>{const o=g0(c);return o.rn?o.sum/o.rn:0;};
  const sorter={used:(a,b)=>g0(b).n-g0(a).n,rest:(a,b)=>g0(a).last.localeCompare(g0(b).last),rate:(a,b)=>avg(b)-avg(a)}[F.sort]||((a,b)=>(b.fav-a.fav));
  const list=S.cards.filter(matchCard).sort((a,b)=>sorter(a,b)||(b.updated-a.updated));
  const used=c=>{const o=st.get(c.id);return o?`<p class="meta">実施${o.n}回 ・ 最後 ${esc(o.last)}${o.rn?' ・ '+RATE[Math.round(o.sum/o.rn)]:''}</p>`:'';};
  g.innerHTML=`<p class="count">${list.length}枚 / 全${S.cards.length}枚</p>`+(list.length?`<div class="cards">${list.map(c=>`
    <button class="card" data-act="open" data-id="${esc(c.id)}">
      <div class="thumb">${c.images[0]?`<img src="${c.images[0].src}" alt="">`:PITCH}</div>
      <div class="cbody">${badges(c)}${c.fav?'<span class="star">★</span>':''}<h3>${esc(c.name)}</h3><p class="meta">${esc(cardMeta(c))}</p>${used(c)}</div>
    </button>`).join('')}</div>`:`<div class="empty">${S.cards.length?'条件に合うカードがありません。しぼり込みをゆるめてください。':'カードがまだありません。「＋ カード」から登録できます。'}</div>`);
}

function shrink(file,m=1400){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');
    cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(im,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',.85));};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('画像を読みこめません'));};im.src=url;});}

/* ========== 写真・PDFからのよみとり（Gemini） ========== */
// APIキーは端末の localStorage にだけ置く（書き出しJSONには入れない）
const LSK='renshu-base.gemini',LSM='renshu-base.geminiModel',GEMINI_MODEL='gemini-2.5-flash';
let scanDraft=null;
const fileB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('ファイルを読めませんでした'));r.readAsDataURL(f);});
const scanPrompt=()=>`あなたはサッカー指導の資料を整理する助手です。添付の写真・PDFにある練習メニューを読みとり、次の形のJSONだけを返してください。
{"sourceTitle":"資料の名前（わかれば）","menus":[{"name":"メニュー名","cats":["wup"],"themes":["テーマ"],"ages":["U-12"],"minP":null,"maxP":null,"gk":false,"minutes":null,"size":"大きさ","equip":["用具"],"method":["方法・ルールを1項目ずつ"],"keys":["キーファクター"],"steps":["トレーニングの積み上げ（段階）"],"notes":["留意点・コーチングポイント"],"gkPoints":["GKポイント"]}]}
きまり：
- メニューが複数あれば、1つずつ別の要素にする。発展形（OP・オプション）も別の要素にする。
- cats は wup（W-up・ウォーミングアップ）、tr1（Tr.1・トレーニング1）、tr2（Tr.2・トレーニング2）、game（Game・ゲーム）のどれか。書かれていなければ内容から1つ選ぶ。
- themes は次の一覧から合うものを選ぶ。合うものがなければ資料の言葉を短く入れる：${S.themes.map(t=>t.name).join('、')}
- ages は ${AGES.join('、')} から選ぶ。書かれていなければ空の配列。
- 文章は丸写しにせず、意味を変えずに短く言いかえる。
- 資料に書かれていない項目は、空の配列・空文字・null にする。数字を作らない。人数は「3対3＋3サーバー」のように読みとれる場合だけ数える。`;
async function scanFiles(files){
  const parts=[{text:scanPrompt()}];let img=null;
  for(const f of files){
    if(f.type==='application/pdf'){if(f.size>15e6)throw new Error('PDFが大きすぎます（15MBまで）');parts.push({inline_data:{mime_type:'application/pdf',data:await fileB64(f)}});}
    else if(f.type.startsWith('image/')){parts.push({inline_data:{mime_type:'image/jpeg',data:(await shrink(f,2000)).split(',')[1]}});if(!img)img=await shrink(f);}
    else throw new Error('写真かPDFをえらんでください');
  }
  const model=localStorage.getItem(LSM)||GEMINI_MODEL;
  const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':localStorage.getItem(LSK)},
    body:JSON.stringify({contents:[{parts}],generationConfig:{response_mime_type:'application/json',temperature:0.2}})});
  const j=await res.json().catch(()=>({}));
  if(!res.ok||j.error)throw new Error((j.error&&j.error.message)||`通信エラー（${res.status}）`);
  const txt=((((j.candidates||[])[0]||{}).content||{}).parts||[]).map(p=>p.text||'').join('');
  let d;try{d=JSON.parse(txt.replace(/^\s*```(?:json)?\s*|\s*```\s*$/g,''));}catch{throw new Error('よみとり結果を解釈できませんでした。もう一度ためしてください');}
  const menus=Array.isArray(d)?d:(d&&Array.isArray(d.menus)?d.menus:[]);
  const title=String((d&&d.sourceTitle)||files[0].name||'').slice(0,80);
  // AIの返事からは決まった項目だけを取り出す（id・図・リンクなどは受けとらない）
  const cards=menus.filter(m=>m&&m.name).map(m=>normCard({name:m.name,cats:m.cats,themes:m.themes,ages:m.ages,minP:m.minP,maxP:m.maxP,gk:m.gk,minutes:m.minutes,size:m.size,equip:m.equip,
    method:m.method,keys:m.keys,steps:m.steps,notes:m.notes,gkPoints:m.gkPoints,src:{type:'jfa',title},share:false})).map(c=>(c.cats.length||c.cats.push('tr1'),c));
  return {cards,img};
}
async function runScan(files){
  if(!localStorage.getItem(LSK)){toast('さきに「設定」でGemini APIキーを登録してください');return;}
  $('#modalBox').innerHTML='<div class="empty"><b>よみとっています…</b><br>1分ほどかかることがあります。このままお待ちください。</div>';$('#modal').classList.add('on');
  let r;
  try{r=await scanFiles(files);}catch(err){console.error(err);ACT.closeModal();toast('よみとれませんでした：'+err.message);return;}

    ${r.cards.map((c,i)=>`<label class="pickitem"><input type="checkbox" data-scan="${i}" checked style="width:22px;height:22px;flex:none"><span>${badges(c)}<b>${esc(c.name)}</b><br><span class="meta">${esc(cardMeta(c))}</span></span></label>`).join('')}

/* ========== 作図ボード ========== */
// 図は {field, items} の形で持ち、表示・印刷のときにSVGにする。座標は 1000×700 の中。
const BW=1000,BH=700;
const FIELDS=[['goal','ゴール前'],['half','ハーフコート'],['full','フルコート'],['grid','グリッド'],['blank','コートなし']];
const TOOLS=[['select','えらぶ'],['p:w','白'],['p:b','黒'],['p:S','サーバー'],['p:G','GK'],['p:F','フリー'],
  ['ball','ボール'],['cone','コーン'],['marker','マーカー'],['goal','ゴール'],['mini','ミニゴール'],
  ['l:pass','パス'],['l:run','人の動き'],['l:drib','ドリブル'],['l:line','線'],['r','わく'],['t','文字']];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const n1=v=>Math.round(v*10)/10;
function normBoard(b){
  const N=v=>{const n=Number(v);return Number.isFinite(n)?clamp(n,-200,1200):0;};
  const items=(Array.isArray(b.items)?b.items:[]).slice(0,300).map(it=>{
    if(!it)return null;
    switch(it.t){
      case 'p':return ['w','b','S','G','F'].includes(it.k)?{t:'p',k:it.k,x:N(it.x),y:N(it.y)}:null;
      case 'ball':case 'cone':case 'marker':return {t:it.t,x:N(it.x),y:N(it.y)};
      case 'goal':case 'mini':return {t:it.t,x:N(it.x),y:N(it.y),rot:(Math.round(N(it.rot)/90)*90)%360};
      case 'l':{if(!['pass','run','drib','line'].includes(it.k))return null;
        const o={t:'l',k:it.k,x1:N(it.x1),y1:N(it.y1),x2:N(it.x2),y2:N(it.y2)};if(it.cx!=null){o.cx=N(it.cx);o.cy=N(it.cy);}return o;}
      case 'r':return {t:'r',x:N(it.x),y:N(it.y),w:N(it.w),h:N(it.h)};
      case 't':return {t:'t',x:N(it.x),y:N(it.y),s:String(it.s||'').slice(0,40)};
      default:return null;
    }}).filter(Boolean);
  return {field:FIELDS.some(f=>f[0]===b.field)?b.field:'blank',items};
}
function goalSVG(cx,cy,rot,w,d){
  let net=`<path d="M${-w/2} 0H${w/2}"/>`;
  for(let i=1;i<8;i++)net+=`<path d="M${n1(-w/2+w*i/8)} ${-d/2}V${d/2}"/>`;
  return `<g transform="translate(${n1(cx)} ${n1(cy)}) rotate(${rot||0})"><rect x="${-w/2}" y="${-d/2}" width="${w}" height="${d}" fill="#eee" stroke="#222" stroke-width="3"/><g stroke="#999" stroke-width="1.5">${net}</g></g>`;
}
function fieldSVG(f){
  const L='fill="none" stroke="#222" stroke-width="3"';
  if(f==='grid')return `<rect x="100" y="80" width="800" height="540" ${L}/>`;
  if(f==='goal')return `<path d="M60 90H940" ${L}/><rect x="150" y="90" width="700" height="290" ${L}/><rect x="340" y="90" width="320" height="95" ${L}/>`+goalSVG(500,68,0,130,44);
  if(f==='half')return `<rect x="40" y="70" width="920" height="590" ${L}/><rect x="227" y="70" width="546" height="185" ${L}/><rect x="376" y="70" width="248" height="62" ${L}/><path d="M417 255A103 103 0 0 0 583 255M397 660A103 103 0 0 1 603 660" ${L}/><circle cx="500" cy="194" r="4" fill="#222"/>`+goalSVG(500,49,0,100,42);
  if(f==='full')return `<rect x="50" y="60" width="900" height="580" ${L}/><path d="M500 60V640" ${L}/><circle cx="500" cy="350" r="78" ${L}/><rect x="50" y="178" width="141" height="344" ${L}/><rect x="50" y="272" width="47" height="156" ${L}/><rect x="809" y="178" width="141" height="344" ${L}/><rect x="903" y="272" width="47" height="156" ${L}/>`+goalSVG(37,350,90,64,26)+goalSVG(963,350,90,64,26);
  return '';
}
// 線：パス＝実線の矢印、人の動き＝点線の矢印、ドリブル＝波線の矢印、線＝矢印なし
const lineMid=it=>it.cx!=null?{x:.25*it.x1+.5*it.cx+.25*it.x2,y:.25*it.y1+.5*it.cy+.25*it.y2}:{x:(it.x1+it.x2)/2,y:(it.y1+it.y2)/2};
function lineSVG(it,hit){
  const curved=it.cx!=null, arrow=it.k!=='line';
  const q=t=>curved?{x:(1-t)*(1-t)*it.x1+2*t*(1-t)*it.cx+t*t*it.x2,y:(1-t)*(1-t)*it.y1+2*t*(1-t)*it.cy+t*t*it.y2}:{x:it.x1+(it.x2-it.x1)*t,y:it.y1+(it.y2-it.y1)*t};
  const rough=curved?Math.hypot(it.cx-it.x1,it.cy-it.y1)+Math.hypot(it.x2-it.cx,it.y2-it.cy):Math.hypot(it.x2-it.x1,it.y2-it.y1);
  const N=it.k==='drib'?clamp(Math.round(rough/4),12,200):curved?28:1;
  const pts=[],len=[0];
  for(let i=0;i<=N;i++){pts.push(q(i/N));if(i)len.push(len[i-1]+Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y));}
  const total=len[N], cut=arrow?Math.max(0,total-14):total;
  let ex=curved?it.x2-it.cx:it.x2-it.x1, ey=curved?it.y2-it.cy:it.y2-it.y1;
  const el=Math.hypot(ex,ey)||1;ex/=el;ey/=el;
  let d='';
  for(let i=0;i<=N;i++){
    if(len[i]>cut)break;
    let {x,y}=pts[i];
    if(it.k==='drib'){const a=pts[Math.min(N,i+1)],b=pts[Math.max(0,i-1)],tx=a.x-b.x,ty=a.y-b.y,tl=Math.hypot(tx,ty)||1;
      const o=9*Math.sin(len[i]/9)*Math.max(0,Math.min(1,len[i]/20,(cut-len[i])/20));x-=ty/tl*o;y+=tx/tl*o;}
    d+=(d?'L':'M')+n1(x)+' '+n1(y);
  }
  if(arrow)d+=`L${n1(it.x2-ex*14)} ${n1(it.y2-ey*14)}`;
  const bx=it.x2-ex*22,by=it.y2-ey*22;
  return (hit?`<path d="${d}L${n1(it.x2)} ${n1(it.y2)}" fill="none" stroke="#000" stroke-opacity="0" stroke-width="34"/>`:'')
    +`<path d="${d}" fill="none" stroke="#222" stroke-width="${arrow?3.5:3}" stroke-linejoin="round"${it.k==='run'?' stroke-dasharray="12 9"':''}/>`
    +(arrow?`<polygon points="${n1(it.x2)},${n1(it.y2)} ${n1(bx-ey*9)},${n1(by+ex*9)} ${n1(bx+ey*9)},${n1(by-ex*9)}" fill="#222"/>`:'');
}
function itemSVG(it,i,editing){
  const x=n1(it.x),y=n1(it.y);let s='';

const boardInner=(b,editing)=>`<rect width="${BW}" height="${BH}" fill="#fff"/>`+fieldSVG(b.field)+b.items.map((it,i)=>itemSVG(it,i,editing)).join('');
const svgURL=b=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${BW} ${BH}" font-family="sans-serif">${boardInner(b,false)}</svg>`);

let B=null; // 作図中の状態
function toolIcon(id){

function drawBoard(){
  const b=B.board,it=b.items[B.sel];
  const H=(k,x,y)=>`<circle data-h="${k}" cx="${n1(x)}" cy="${n1(y)}" r="22" fill="#1565C0" fill-opacity=".25" stroke="#1565C0" stroke-width="2.5"/>`;
  let h=boardInner(b,true);
  if(it){
    if(it.t==='l'){const m=lineMid(it);h+=H('p1',it.x1,it.y1)+H('p2',it.x2,it.y2)+H('c',m.x,m.y);}
    else if(it.t==='r')h+=H('rs',it.x+it.w,it.y+it.h);
    else h+=`<circle cx="${n1(it.x)}" cy="${n1(it.y)}" r="${it.t==='goal'?78:it.t==='t'?44:32}" fill="none" stroke="#1565C0" stroke-width="2.5" stroke-dasharray="7 6" pointer-events="none"/>`;

  $('#bsel').innerHTML=it?`<button class="btn sm danger" data-act="bDel">これを消す</button>`

const bSnap=()=>{B.undo.push(JSON.stringify(B.board));if(B.undo.length>60)B.undo.shift();};
function bPoint(e){const p=new DOMPoint(e.clientX,e.clientY).matrixTransform($('#bsvg').getScreenCTM().inverse());return {x:clamp(Math.round(p.x),0,BW),y:clamp(Math.round(p.y),0,BH)};}
function bDown(e){
  if(!B)return;e.preventDefault();
  const p=bPoint(e),items=B.board.items,tool=B.tool,h=e.target.closest('[data-h]');
  if(h)B.drag={type:'h',h:h.dataset.h,snapped:false};
  else if(tool==='select'){const g=e.target.closest('[data-i]');B.sel=g?+g.dataset.i:null;B.drag=g?{type:'move',last:p,snapped:false}:null;drawBoard();}
  else if(tool==='t'){const s=prompt('入れる文字（例：12m）');if(s&&s.trim()){bSnap();items.push({t:'t',x:p.x,y:p.y,s:s.trim().slice(0,40)});B.sel=null;drawBoard();}return;}
  else if(tool.startsWith('l:')){bSnap();items.push({t:'l',k:tool.slice(2),x1:p.x,y1:p.y,x2:p.x,y2:p.y});B.sel=items.length-1;B.drag={type:'h',h:'p2',snapped:true,fresh:true};}
  else if(tool==='r'){bSnap();items.push({t:'r',x:p.x,y:p.y,w:0,h:0});B.sel=items.length-1;B.drag={type:'h',h:'rs',snapped:true,fresh:true};}
  else{bSnap();const it=tool.startsWith('p:')?{t:'p',k:tool.slice(2),x:p.x,y:p.y}:{t:tool,x:p.x,y:p.y};if(tool==='goal'||tool==='mini')it.rot=0;items.push(it);B.sel=null;drawBoard();return;}
  if(B.drag)$('#bsvg').setPointerCapture(e.pointerId);
}
function bMove(e){
  if(!B||!B.drag)return;
  const p=bPoint(e),it=B.board.items[B.sel],d=B.drag;if(!it)return;
  if(!d.snapped){bSnap();d.snapped=true;}
  if(d.type==='move'){const dx=p.x-d.last.x,dy=p.y-d.last.y;d.last=p;
    if(it.t==='l'){it.x1+=dx;it.x2+=dx;it.y1+=dy;it.y2+=dy;if(it.cx!=null){it.cx+=dx;it.cy+=dy;}}else{it.x+=dx;it.y+=dy;}}
  else if(d.h==='p1'){it.x1=p.x;it.y1=p.y;}
  else if(d.h==='p2'){it.x2=p.x;it.y2=p.y;}
  else if(d.h==='c'){it.cx=2*p.x-(it.x1+it.x2)/2;it.cy=2*p.y-(it.y1+it.y2)/2;}
  else if(d.h==='rs'){it.w=p.x-it.x;it.h=p.y-it.y;}
  drawBoard();
}
function bUp(){
  if(!B||!B.drag)return;
  const d=B.drag,it=B.board.items[B.sel];B.drag=null;
  if(it&&it.t==='r'){if(it.w<0){it.x+=it.w;it.w=-it.w;}if(it.h<0){it.y+=it.h;it.h=-it.h;}}
  if(d.fresh&&it&&(it.t==='l'?Math.hypot(it.x2-it.x1,it.y2-it.y1)<18:(it.w<18||it.h<18))){B.board.items.pop();B.undo.pop();B.sel=null;}
  drawBoard();
}

const curPlan=()=>plan(view().id);
const slotOf=el=>{const p=curPlan(),sid=el.closest('[data-sid]').dataset.sid;return p.slots.find(s=>s.id===sid);};
function candidates(p,s,o){
  return S.cards.filter(c=>c.cats.includes(s.cat)
    &&(!o.theme||!p.theme||c.themes.includes(p.theme))
    &&(!o.age||!p.age||!c.ages.length||c.ages.includes(p.age))
    &&(!o.players||matchPlayers(c,p.players)));
}
// おまかせの点数：お気に入りと、できばえの良かったカードを優先。直近2週間に使ったカードは後回し。
function pickScore(c,p,st){
  const o=st.get(c.id);let sc=Math.random()*1.5+(c.fav?2:0);
  if(!o)return sc+.5;
  if(o.rn)sc+=(o.sum/o.rn-2)*1.5;
  const d=(Date.parse(p.date)-Date.parse(o.last))/864e5;
  if(d>=0&&d<14)sc-=2;
  return sc;
}
function nextCandidate(p,s){
  const others=new Set(p.slots.filter(x=>x!==s).map(x=>x.cardId));
  let c=candidates(p,s,{theme:1,age:1,players:1}).filter(x=>!others.has(x.id));
  if(c.length<2)c=candidates(p,s,{theme:1}).filter(x=>!others.has(x.id));
  c.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  if(!c.length||(c.length===1&&c[0].id===s.cardId))return null;
  return c[(c.findIndex(x=>x.id===s.cardId)+1)%c.length];
}
function spreadTime(p){
  if(p.totalMin==null){toast('さきに「総時間（分）」を入れてください');return;}
  if(!p.slots.length)return;
  if(p.slots.some(s=>s.minutes!=null)&&!confirm('いま入っている時間を、ふり分けなおしますか？'))return;
  const W={wup:3,tr1:5,tr2:5,game:7},sum=p.slots.reduce((a,s)=>a+W[s.cat],0);
  let rest=p.totalMin;
  p.slots.forEach((s,i)=>{const m=i===p.slots.length-1?rest:Math.min(rest,Math.round(p.totalMin*W[s.cat]/sum/5)*5);s.minutes=Math.max(0,m);rest-=s.minutes;});
  savePlan(p);render();toast('時間をふり分けました');
}
function autoFill(p){
  let targets=p.slots.filter(s=>!card(s.cardId));
  if(!targets.length){if(!confirm('すべての枠を入れなおしますか？'))return;targets=p.slots;}
  const used=new Set(p.slots.filter(s=>!targets.includes(s)).map(s=>s.cardId)),st=cardStats();
  let ok=0;
  for(const s of targets){
    let c=candidates(p,s,{theme:1,age:1,players:1}).filter(x=>!used.has(x.id));
    if(!c.length)c=candidates(p,s,{theme:1}).filter(x=>!used.has(x.id));
    if(!c.length){s.cardId=null;continue;}
    const pickd=c.map(x=>[pickScore(x,p,st),x]).sort((a,b)=>b[0]-a[0])[0][1];
    s.cardId=pickd.id;s.rating=0;s.result='';used.add(pickd.id);ok++;
  }
  savePlan(p);render();
  toast(ok===targets.length?`${ok}枠に入れました`:`${ok}枠に入れました。合うカードがない枠が${targets.length-ok}つあります`);
}

function printPlan(p,mode){
  const info=[p.template?'':p.date,p.theme?`テーマ：${p.theme}`:'',p.age?`対象：${p.age}`:'',p.players!=null?`${p.players}人`:'',`合計 ${p.slots.reduce((a,s)=>a+(slotMin(s)||0),0)}分`].filter(Boolean).join('　');
  const rows=p.slots.map(s=>{const c=card(s.cardId),m=slotMin(s);return `<tr><td style="white-space:nowrap"><b>${esc(slotLabel(p,s))}</b></td><td style="white-space:nowrap">${m!=null?m+'分':''}</td>
    <td>${c?`<b>${esc(c.name)}</b>${c.images[0]?`<img src="${c.images[0].src}" alt="">`:''}`:''}</td>
    <td>${c?`${esc([c.size,c.equip.join('、')].filter(Boolean).join(' ／ '))}${mode==='list'?ul(c.method):''}`:''}</td>
    <td>${c?ul(c.keys):''}${s.memo?`<div>メモ：${esc(s.memo)}</div>`:''}</td></tr>`;}).join('');
  let h=`<div class="p-head"><h1>${esc(planTitle(p))}</h1><p>${esc(info)}</p></div>
    <table class="p-table"><thead><tr><th>区分</th><th>時間</th><th>メニュー</th><th>オーガナイズ</th><th>キーファクター・メモ</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="p-memo">ふりかえり<div class="pre">${esc(p.review)}</div></div>`;
  if(mode==='detail')h+=p.slots.map(s=>card(s.cardId)).filter(Boolean).map(c=>`<div class="p-page">${sheetHTML(c)}</div>`).join('');
  $('#print').innerHTML=h;
  setTimeout(()=>window.print(),150);
}

/* ========== 設定 ========== */
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;

  const custom=S.themes.filter(t=>!DEFAULT_THEMES.some(d=>d.name===t.name));
  return `<div class="panel"><h3>バックアップ</h3>
    <p class="meta">カード ${S.cards.length}枚・計画 ${S.plans.length}件。データはこの端末の中だけに保存されています。ときどき書き出しておくと安心です。</p>
    <div class="bar" style="margin-top:10px"><button class="btn pri" data-act="export">書き出す（JSON）</button>
    <label class="btn" style="display:inline-flex;align-items:center">読みこむ<input type="file" id="importIn" accept=".json,application/json" hidden></label></div>
    <p class="hint">読みこみは「追加」です。同じカードは新しい内容で上書きされ、ほかのカードは消えません。</p></div>
  <div class="panel"><h3>写真・PDFのよみとり（Gemini）</h3>
    <p class="meta">いまの状態：${localStorage.getItem(LSK)?'APIキー登録ずみ':'APIキー未登録（よみとりは使えません）'}</p>
    <label class="f" style="margin-top:8px"><span>Gemini APIキー</span><input type="password" id="gemKey" autocomplete="off" placeholder="${localStorage.getItem(LSK)?'登録ずみ（変えるときだけ入力）':'AIza...'}"></label>
    <label class="f"><span>モデル名 <span class="hint">ふつうはこのままで大丈夫です</span></span><input type="text" id="gemModel" value="${esc(localStorage.getItem(LSM)||GEMINI_MODEL)}"></label>
    <div class="bar"><button class="btn pri" data-act="gemSave">保存する</button>${localStorage.getItem(LSK)?'<button class="btn" data-act="gemClear">APIキーを消す</button>':''}</div>
    <p class="hint">キーは Google AI Studio で作れます。キーはこの端末の中だけに保存され、書き出しファイルには入りません。よみとる写真・PDFは Google に送られます。</p></div>
  <div class="panel"><h3>テーマ（目的）の管理</h3>
    <div class="bar"><input type="text" id="themeAdd" placeholder="あたらしいテーマ" style="flex:1;min-width:160px"><button class="btn" data-act="themeAdd">追加</button></div>
    ${custom.length?custom.map(t=>`<div class="bar" style="margin-bottom:6px"><span>${esc(t.name)}</span><span class="grow"></span><button class="btn sm" data-act="themeDel" data-name="${esc(t.name)}">消す</button></div>`).join(''):'<p class="meta">自分で追加したテーマはまだありません。</p>'}</div>
  <div class="panel"><h3>お手本カード</h3>
    <p class="meta">JFA ナショナルトレセンU-12「ゴールを奪う」をもとにした6枚と、ひな型1件です。消してしまったときに入れなおせます。</p>
    <button class="btn" data-act="reseed" style="margin-top:10px">お手本を入れなおす</button></div>
  <div class="panel"><h3>iPad・iPhoneで使うとき</h3>
    <p class="meta">Safariの共有ボタンから「ホーム画面に追加」をして、ホーム画面のアイコンから開いてください。Safariのままだと、7日間開かないとデータが消えることがあります。</p></div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify({app:'renshu-base',version:1,exported:new Date().toISOString(),themes:S.themes,cards:S.cards,plans:S.plans})],{type:'application/json'});
  const name=`renshu-base-${today()}.json`, file=new File([blob],name,{type:'application/json'});
  if(isIOS&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file]}).catch(()=>{});return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function importData(text){
  let d;try{d=JSON.parse(text);}catch{toast('ファイルを読めませんでした（JSONではありません）');return;}
  const cards=Array.isArray(d)?d:(Array.isArray(d.cards)?d.cards:[]), plans=Array.isArray(d.plans)?d.plans:[];
  if(!cards.length&&!plans.length){toast('カードも計画も入っていませんでした');return;}
  for(const t of (Array.isArray(d.themes)?d.themes:[])){if(t&&t.name&&!S.themes.some(x=>x.name===t.name))S.themes.push({group:String(t.group||'じぶんのテーマ'),name:String(t.name)});}
  for(const raw of cards){const c=normCard(raw);for(const t of c.themes){if(!S.themes.some(x=>x.name===t))S.themes.push({group:'じぶんのテーマ',name:t});}
    const i=S.cards.findIndex(x=>x.id===c.id);if(i>=0)S.cards[i]=c;else S.cards.push(c);await dbPut('cards',c);}
  for(const raw of plans){const p=normPlan(raw);const i=S.plans.findIndex(x=>x.id===p.id);if(i>=0)S.plans[i]=p;else S.plans.push(p);await dbPut('plans',p);}
  await saveThemes();render();toast(`カード${cards.length}枚・計画${plans.length}件を読みこみました`);
}

/* ========== 描画 ========== */
function render(){
  const v=view(), m=$('#main');
  const root=stack[0].name;
  $$('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===root));
  const a2=isIOS&&!isStandalone()&&!sessionStorage.getItem('a2hs')?`<div id="a2hs" style="display:block">ホーム画面に追加して使ってください（Safariのままだとデータが消えることがあります）。<button class="btn sm" data-act="a2hsClose" style="margin-left:6px">とじる</button></div>`:'';
  m.innerHTML=a2+({library:vLibrary,plans:vPlans,settings:vSettings,card:()=>vCard(v.id),cardEdit:()=>vCardEdit(v.id),plan:()=>vPlan(v.id)}[v.name])();
  if(v.name==='library')renderGrid();
  if(v.name==='cardEdit')renderEditParts();
}

/* ========== 操作 ========== */
const ACT={
  tab:el=>{edit=null;stack=[{name:el.dataset.tab}];render();window.scrollTo(0,0);},
  back,
  a2hsClose:()=>{sessionStorage.setItem('a2hs','1');render();},
  open:(el,e)=>{e.preventDefault();ACT.closeModal();go({name:'card',id:el.dataset.id});},
  newCard:()=>{edit=null;go({name:'cardEdit',id:null});},
  editCard:el=>{edit=null;go({name:'cardEdit',id:el.dataset.id});},
  cancelEdit:()=>{edit=null;back();},
  fav:el=>{const c=card(el.dataset.id);c.fav=!c.fav;saveCard(c);render();},
  dupCard:el=>{const c=card(el.dataset.id),n=normCard({...c,id:uid(),name:c.name+'（コピー）',images:[...c.images],opIds:[],fav:false,created:Date.now()});
    S.cards.push(n);saveCard(n);edit=null;go({name:'cardEdit',id:n.id});toast('複製しました。発展形として書きかえられます');},
  delCard:el=>{const c=card(el.dataset.id);if(!confirm(`「${c.name}」を削除しますか？`))return;
    S.cards=S.cards.filter(x=>x!==c);dbDel('cards',c.id);back();toast('削除しました');},
  rmImg:el=>{edit.images.splice(+el.dataset.i,1);renderEditParts();},
  rmOp:el=>{edit.opIds=edit.opIds.filter(x=>x!==el.dataset.id);renderEditParts();},
  drawFig:()=>openBoard(null),
  editBoard:el=>openBoard(+el.dataset.i),
  bTool:el=>{B.tool=el.dataset.tool;if(B.tool!=='select')B.sel=null;drawBoardUI();},
  bUndo:()=>{if(!B.undo.length){toast('これ以上は戻せません');return;}B.board=JSON.parse(B.undo.pop());B.sel=null;drawBoardUI();},
  bCancel:()=>{if(B.undo.length&&!confirm('描いた内容を捨てますか？'))return;closeBoard();},
  bDone:()=>{const board=normBoard(B.board);if(!board.items.length){toast('まだ何も描かれていません');return;}
    const entry={src:svgURL(board),board};if(B.idx!=null)edit.images[B.idx]=entry;else edit.images.push(entry);closeBoard();renderEditParts();},
  bDel:()=>{bSnap();B.board.items.splice(B.sel,1);B.sel=null;drawBoard();},
  bRot:()=>{bSnap();const it=B.board.items[B.sel];it.rot=((it.rot||0)+90)%360;drawBoard();},
  bText:()=>{const it=B.board.items[B.sel],s=prompt('文字',it.s);if(s&&s.trim()){bSnap();it.s=s.trim().slice(0,40);drawBoard();}},
  bStraight:()=>{bSnap();const it=B.board.items[B.sel];delete it.cx;delete it.cy;drawBoard();},
  bClear:()=>{if(!confirm('描いたものをぜんぶ消しますか？（「もとに戻す」で戻せます）'))return;bSnap();B.board.items=[];B.sel=null;drawBoard();},
  addToPlan:el=>renderAddToPlan(el.dataset.id),
  addToNew:el=>{const p=newPlan();S.plans.push(p);putIntoPlan(p,card(el.dataset.id));ACT.closeModal();go({name:'plan',id:p.id});toast('あたらしい計画に入れました');},
  addToThis:el=>{const p=plan(el.dataset.pid);putIntoPlan(p,card(el.dataset.id));ACT.closeModal();go({name:'plan',id:p.id});toast('計画に入れました');},
  closeModal:()=>{$('#modal').classList.remove('on');picker=null;},
  newPlan:()=>{const p=newPlan();S.plans.push(p);savePlan(p);go({name:'plan',id:p.id});},
  openPlan:el=>go({name:'plan',id:el.dataset.id}),
  planAuto:()=>autoFill(curPlan()),
  planTime:()=>spreadTime(curPlan()),
  slotNext:el=>{const p=curPlan(),s=slotOf(el),c=nextCandidate(p,s);if(!c){toast('ほかに合うカードがありません');return;}s.cardId=c.id;s.rating=0;s.result='';savePlan(p);render();},
  rate:el=>{const p=curPlan(),s=slotOf(el),v=+el.dataset.v;s.rating=s.rating===v?0:v;savePlan(p);render();},
  gemSave:()=>{const k=$('#gemKey').value.trim(),m=$('#gemModel').value.trim();if(k)localStorage.setItem(LSK,k);if(m)localStorage.setItem(LSM,m);else localStorage.removeItem(LSM);render();toast('保存しました');},
  gemClear:()=>{localStorage.removeItem(LSK);render();toast('APIキーを消しました');},
  scanSave:async()=>{const pick=$$('#modalBox [data-scan]').filter(x=>x.checked).map(x=>scanDraft[+x.dataset.scan]);if(!pick.length){toast('1つ以上えらんでください');return;}
    for(const c of pick){await ensureThemes(c.themes);S.cards.push(c);await saveCard(c);}
    scanDraft=null;ACT.closeModal();edit=null;stack=[{name:'library'}];render();toast(`${pick.length}枚を登録しました。内容を確認してください`);},
  planPrint:el=>printPlan(curPlan(),el.dataset.mode),
  planDup:()=>{const p=curPlan(),n=normPlan({...p,id:uid(),date:today(),title:p.template?'':p.title&&p.title+'（コピー）',template:false,review:'',slots:p.slots.map(s=>({...s,id:uid()})),created:Date.now()});
    S.plans.push(n);savePlan(n);stack.pop();go({name:'plan',id:n.id});toast('計画を作りました');},
  planTpl:()=>{const p=curPlan();p.template=!p.template;savePlan(p);render();toast(p.template?'ひな型にしました':'ふつうの計画にもどしました');},
  planDel:()=>{const p=curPlan();if(!confirm(`「${planTitle(p)}」を削除しますか？`))return;S.plans=S.plans.filter(x=>x!==p);dbDel('plans',p.id);back();toast('削除しました');},
  slotAdd:el=>{const p=curPlan();p.slots.push({id:uid(),cat:el.dataset.cat,cardId:null,minutes:null,memo:''});savePlan(p);render();},
  slotDel:el=>{const p=curPlan(),s=slotOf(el);if(card(s.cardId)&&!confirm('この枠を消しますか？'))return;p.slots=p.slots.filter(x=>x!==s);savePlan(p);render();},
  slotUp:el=>{const p=curPlan(),i=p.slots.indexOf(slotOf(el));if(i>0){[p.slots[i-1],p.slots[i]]=[p.slots[i],p.slots[i-1]];savePlan(p);render();}},
  slotDown:el=>{const p=curPlan(),i=p.slots.indexOf(slotOf(el));if(i<p.slots.length-1){[p.slots[i+1],p.slots[i]]=[p.slots[i],p.slots[i+1]];savePlan(p);render();}},
  pick:el=>{const p=curPlan();picker={planId:p.id,slotId:slotOf(el).id,theme:true,age:true,players:true,q:''};renderPicker();$('#modal').classList.add('on');},
  unpick:el=>{const p=curPlan();slotOf(el).cardId=null;savePlan(p);render();},
  choose:el=>{const p=plan(picker.planId),s=p.slots.find(x=>x.id===picker.slotId);s.cardId=el.dataset.id;savePlan(p);ACT.closeModal();render();},
  export:exportData,
  themeAdd:()=>{const v=$('#themeAdd').value.trim();if(!v)return;if(S.themes.some(t=>t.name===v)){toast('同じテーマがすでにあります');return;}
    S.themes.push({group:'じぶんのテーマ',name:v});saveThemes();render();},
  themeDel:el=>{S.themes=S.themes.filter(t=>t.name!==el.dataset.name);saveThemes();render();},
  reseed:async()=>{await putSeed();render();toast('お手本を入れました');}
};
document.addEventListener('click',e=>{
  if(e.target.id==='modal'){ACT.closeModal();return;}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const fn=ACT[el.dataset.act];if(fn)fn(el,e);
});
document.addEventListener('submit',e=>{if(e.target.id==='cardForm'){e.preventDefault();submitCard(e.target);}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.ff){const k=t.dataset.ff;
    if(k==='cat'){F.cat=t.checked?t.value:'';$$('[data-ff=cat]').forEach(x=>{if(x!==t)x.checked=false;});}
    else if(k==='fav')F.fav=t.checked;else F[k]=t.value;
    renderGrid();return;}
  if(t.dataset.pk&&picker){const k=t.dataset.pk;if(k==='q'){picker.q=t.value;const pos=t.selectionStart;renderPicker();const q=$('[data-pk=q]');q.focus();q.setSelectionRange(pos,pos);}else{picker[k]=t.checked;renderPicker();}return;}
  if(t.dataset.pf==='done'){const p=curPlan();p.done=t.checked;savePlan(p);render();return;}
  if(t.dataset.pf){const p=curPlan(),k=t.dataset.pf;p[k]=(k==='players'||k==='totalMin')?num(t.value):t.value;savePlan(p);
    if(k==='totalMin')$('#total').outerHTML=totalHTML(p);return;}
  if(t.dataset.sf){const p=curPlan(),s=slotOf(t),k=t.dataset.sf;s[k]=k==='minutes'?num(t.value):t.value;savePlan(p);
    if(k==='minutes')$('#total').outerHTML=totalHTML(p);return;}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='imgIn'){for(const f of t.files){try{edit.images.push({src:await shrink(f),board:null});}catch(err){toast(err.message);}}t.value='';renderEditParts();}
  if(t.id==='scanIn'&&t.files.length){const files=[...t.files];t.value='';await runScan(files);}
  if(t.id==='bfield'&&B){bSnap();B.board.field=t.value;drawBoard();}
  if(t.id==='opAdd'&&t.value){if(!edit.opIds.includes(t.value))edit.opIds.push(t.value);t.value='';renderEditParts();}
  if(t.id==='importIn'&&t.files[0]){await importData(await t.files[0].text());t.value='';}
});
window.addEventListener('afterprint',()=>{$('#print').innerHTML='';});
{const s=$('#bsvg');s.addEventListener('pointerdown',bDown);s.addEventListener('pointermove',bMove);s.addEventListener('pointerup',bUp);s.addEventListener('pointercancel',bUp);}

/* ========== 起動 ========== */
(async()=>{
  try{
    db=await openDB();
    S.cards=(await dbAll('cards')).map(normCard);
    S.plans=(await dbAll('plans')).map(normPlan);
    const meta=await dbAll('meta'), get=k=>(meta.find(m=>m.key===k)||{}).value;
    S.themes=get('themes')||DEFAULT_THEMES.map(t=>({...t}));
    if(!get('seeded')){await putSeed();await dbPut('meta',{key:'seeded',value:1});await saveThemes();}
    if(!get('seedfig')){await addSeedFigs();await dbPut('meta',{key:'seedfig',value:1});}
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  }catch(err){console.error(err);$('#main').innerHTML='<div class="empty">データの保存場所をひらけませんでした。プライベートブラウズを切って、もう一度ひらいてください。</div>';return;}
  render();
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
